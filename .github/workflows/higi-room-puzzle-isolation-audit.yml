name: Higi cross-room puzzle isolation audit (read-only)
on:
  push:
    branches: [analysis/shared-room-puzzle-isolation-20261120]
    paths: ['.github/workflows/higi-room-puzzle-isolation-audit.yml', 'cloud-tests/room-puzzle-isolation/**']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reconstruct pinned app v0.15.212
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/higi-room
          curl --silent --show-error --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o /tmp/higi-room/base.zip \
            "https://api.github.com/repos/higicrossword/Higi-Releases/releases/assets/720424907"
          echo 'ad14647edf7facd1d20309cfd2ae48cca779288ad06488c4d80b2404d8933dd7  /tmp/higi-room/base.zip' | sha256sum -c -
          unzip -q /tmp/higi-room/base.zip -d /tmp/higi-room
          ROOT=/tmp/higi-room/HebrewCrosswordApp_v0.15.175
          git -C "$ROOT" init -q
          git -C "$ROOT" add -A
          git -C "$ROOT" -c user.name=Audit -c user.email=audit@localhost commit -qm baseline
          python3 - <<'PY'
          import base64,lzma,hashlib,json,pathlib
          cfg=json.loads(pathlib.Path('cloud-releases/v0.15.212-DRY.json').read_text())
          data=lzma.decompress(base64.b64decode(''.join(pathlib.Path(cfg['patchFile']).read_text().split()),validate=True))
          assert hashlib.sha256(data).hexdigest()==cfg['patchSha256']
          pathlib.Path('/tmp/higi-room/v212.patch').write_bytes(data)
          PY
          git -C "$ROOT" apply /tmp/higi-room/v212.patch
      - name: Inspect room transitions and state ownership (no Firebase writes)
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/higi-room/HebrewCrosswordApp_v0.15.175/app/src/main/java/com/example/hebrewcrossword')
          files=['MainActivity.kt','FirebaseSharing.kt','SharingLogic.kt','RoomPuzzleSafety.kt','CrosswordView.kt','CrosswordSession.kt']
          pats=[
          r'disconnect',r'connect\(',r'activatePuzzle',r'activate.*crossword',r'joinRoom',r'join.room',r'room.*puzzle',
          r'removePresence',r'currentRoom',r'activeRoom',r'sharedRoom',r'sharedPuzzle',r'addValueEventListener',
          r'onDataChange',r'ValueEventListener',r'ChildEventListener',r'setProtectedSolutionCells',r'protectedSolutionCells',
          r'setProtectedCells',r'\.letter\s*=',r'cells\s*=',r'applySnapshot',r'letterUpdate',r'gridVerified',
          r'RoomPuzzleSafety',r'clear.*shared',r'shared.*clear',r'room.*disconnect',r'puzzle.*activate'
          ]
          for name in files:
            f=p/name
            if not f.exists():continue
            lines=f.read_text().splitlines()
            print('### FILE',name,'LINES',len(lines))
            count=0
            for i,line in enumerate(lines):
              if any(re.search(pat,line,re.I) for pat in pats):
                if re.search(r'comment|^\s*\*|^\s*//',line):continue
                if name=='MainActivity.kt' and count>230:continue
                print(f'HIT {name}:{i+1} {line.strip()[:240]}')
                count+=1
          for name in ('MainActivity.kt','FirebaseSharing.kt'):
            lines=(p/name).read_text().splitlines()
            print('### CONTROL FLOW CONTEXT',name)
            locations=[i for i,line in enumerate(lines) if re.search('disconnect room=|connected room=|join-room ok|connect room=|setProtectedSolutionCells|removePresence|onRoomUpdated',line,re.I)]
            selected=[]
            for i in locations:
              if any(abs(i-prev)<25 for prev in selected):continue
              selected.append(i)
            for i in selected[:25]:
              print('---',name,i+1,'---')
              for j in range(max(0,i-9),min(len(lines),i+15)):
                print(f'{j+1:05d} {lines[j][:260]}')
          PY

      - name: Focused join and puzzle migration code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/higi-room/HebrewCrosswordApp_v0.15.175/app/src/main/java/com/example/hebrewcrossword')
          sections={
          'MainActivity.kt':[(1093,1155),(1830,1917),(2027,2140),(2395,2475)],
          'FirebaseSharing.kt':[(645,740),(740,880),(880,990),(1104,1140)],
          'SharingCodec.kt':[(1,120)],
          'RoomPuzzleSafety.kt':[(1,110)],
          'SharingLogic.kt':[(1,150)]
          }
          for name,rs in sections.items():
            f=p/name; lines=f.read_text().splitlines()
            for lo,hi in rs:
              print(f'=== {name} {lo}-{hi}')
              for i in range(lo-1,min(hi,len(lines))):
                print(f'{i+1:05d} {lines[i]}')
          PY

      - name: Inspect room creation seeded cells and room connection cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/higi-room/HebrewCrosswordApp_v0.15.175/app/src/main/java/com/example/hebrewcrossword')
          sections={
          'FirebaseSharing.kt':[(112,190),(215,320),(320,425),(631,653),(1100,1155)],
          'MainActivity.kt':[(1940,2027),(875,911)],
          'SharingLogic.kt':[(150,255)]
          }
          for name,rs in sections.items():
            lines=(p/name).read_text().splitlines()
            for lo,hi in rs:
              print(f'=== {name} {lo}-{hi}')
              for i in range(lo-1,min(hi,len(lines))):
                print(f'{i+1:05d} {lines[i]}')
          PY

      - name: Apply room to room protected-crossing isolation patch
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/higi-room/HebrewCrosswordApp_v0.15.175
          git -C "$ROOT" add -A
          git -C "$ROOT" -c user.name=Audit -c user.email=audit@localhost commit -qm v212
          python3 cloud-tests/room-puzzle-isolation/fix-puzzle-protected-cells.py "$ROOT"
          python3 cloud-tests/room-puzzle-isolation/fix-protected-crossing-input.py "$ROOT"
          git -C "$ROOT" add -N -A
          git -C "$ROOT" diff --check
          python3 - <<'PY'
          import subprocess
          p='/tmp/higi-room/HebrewCrosswordApp_v0.15.175'
          changed=set(subprocess.check_output(['git','-C',p,'diff','--name-only'],text=True).splitlines())
          expected={
            'app/src/main/java/com/example/hebrewcrossword/CrosswordView.kt',
            'app/src/main/java/com/example/hebrewcrossword/CrosswordSession.kt',
            'app/src/main/java/com/example/hebrewcrossword/MainActivity.kt',
            'app/src/main/java/com/example/hebrewcrossword/FirebaseSharing.kt',
            'app/src/main/java/com/example/hebrewcrossword/PuzzleProtectedCellsScope.kt',
            'app/src/test/java/com/example/hebrewcrossword/PuzzleProtectedCellsScopeTest.kt',
            'app/src/test/java/com/example/hebrewcrossword/CrosswordProtectedCrossingTypingRegressionTest.kt'
          }
          assert changed==expected,('unexpected changes',changed)
          assert 'PuzzleProtectedCellsScope.forPuzzle' in open(p+'/app/src/main/java/com/example/hebrewcrossword/CrosswordView.kt').read()
          print('ROOM_PROTECTION_SCOPE_DIFF_PASS')
          PY
      - name: Run focused puzzle-switch regression tests without publishing
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/higi-room/HebrewCrosswordApp_v0.15.175
          gradle --no-daemon -PhigiDryBuild=true :app:testDebugUnitTest --tests '*PuzzleProtectedCellsScopeTest' --tests '*CrosswordProtectedCrossingTypingRegressionTest' > /tmp/higi-room/test.log 2>&1 || {
            tail -95 /tmp/higi-room/test.log
            exit 1
          }
          tail -20 /tmp/higi-room/test.log
          echo ROOM_PROTECTION_SCOPE_TEST_PASS_NO_RELEASE

      - name: Full Android JVM regression suite and local DRY debug compile (no publishing)
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/higi-room/HebrewCrosswordApp_v0.15.175
          gradle --no-daemon -PhigiDryBuild=true :app:testDebugUnitTest :app:assembleDebug > /tmp/higi-room/full-regression.log 2>&1 || {
             tail -100 /tmp/higi-room/full-regression.log
             exit 1
          }
          tail -30 /tmp/higi-room/full-regression.log
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p=Path('app/build/test-results/testDebugUnitTest')
          cases=failures=errors=0
          for file in p.glob('TEST-*.xml'):
              root=ET.parse(file).getroot()
              cases+=int(root.attrib.get('tests','0'))
              failures+=int(root.attrib.get('failures','0'))
              errors+=int(root.attrib.get('errors','0'))
          assert cases>=5,(cases,failures,errors)
          assert failures==errors==0,(cases,failures,errors)
          apk=Path('app/build/outputs/apk/debug/app-debug.apk')
          assert apk.is_file() and apk.stat().st_size>10_000_000
          print(f'FULL_ROOM_REGRESSION_PASS tests={cases} failures={failures} errors={errors}')
          print('Debug APK compiled on temporary CI runner only; not uploaded or published')
          PY
