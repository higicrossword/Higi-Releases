name: Higi v213 stage signed-QA-approved DRY manifest and dispatch publisher
on:
  push:
    branches: ['release/v0.15.213-oded-length-export']
    paths: ['DO_NOT_RUN_UNTIL_SIGNED_QA_PASS']
permissions:
  contents: write
  actions: write
concurrency:
  group: higi-v213-release-staging
  cancel-in-progress: false
jobs:
  stage:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: higicrossword/Higi-Releases
      BASE_SHA: AD14647EDF7FACD1D20309CFD2AE48CCA779288AD06488C4D80B2404D8933DD7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail closed until v213 original-signer Android QA has succeeded
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $qa=(& gh api "repos/$env:REPO/actions/runs/45039094917" | Out-String | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0 -or $qa.conclusion -ne 'success' -or $qa.head_sha -ne '5060239bd74ed3c85419ede556ed7cc090555706'){
            throw 'Pinned v213 Android QA has not passed; staging forbidden'
          }
          if($qa.head_branch -ne 'release/v0.15.213-oded-length-export'){throw 'Wrong QA branch'}
          & gh release view v0.15.213-DRY --repo $env:REPO *> $null
          if($LASTEXITCODE -eq 0){throw 'Release already exists: refuse overwrite'}
          if(Test-Path 'cloud-releases/v0.15.213-DRY.json'){throw 'Version already staged'}
          Write-Host 'V213_SIGNED_QA_GATE_PASS'
      - name: Retrieve sealed private v175 baseline and verify SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $release=(& gh api "repos/$env:REPO/releases/437513599" | Out-String | ConvertFrom-Json)
          if($LASTEXITCODE -ne 0 -or $release.draft -ne $true -or $release.tag_name -ne 'v0.15.175'){throw 'Sealed private draft unavailable'}
          $asset=@($release.assets|Where-Object {$_.name -eq 'HebrewCrosswordApp_v0.15.175_SOURCE.zip'})
          if($asset.Count -ne 1 -or [long]$asset[0].size -ne 8145322){throw 'Wrong source asset'}
          $z=Join-Path $env:RUNNER_TEMP 'higi-v175-private.zip'
          & curl.exe --fail --silent --show-error --location --retry 3 --header "Authorization: Bearer $env:GH_TOKEN" --header 'Accept: application/octet-stream' --header 'X-GitHub-Api-Version: 2022-11-28' --output $z "https://api.github.com/repos/$env:REPO/releases/assets/$($asset[0].id)"
          if($LASTEXITCODE -ne 0 -or (Get-FileHash $z -Algorithm SHA256).Hash -ne $env:BASE_SHA){throw 'Immutable source checksum failed'}
          $dir=Join-Path $env:RUNNER_TEMP 'higi-v213-stage-source'
          Expand-Archive $z -DestinationPath $dir -Force
          $root=Join-Path $dir 'HebrewCrosswordApp_v0.15.175'
          if(!(Test-Path (Join-Path $root 'app/build.gradle.kts'))){throw 'Source archive format invalid'}
          Add-Content -Path $env:GITHUB_ENV -Value "HIGI_SRC=$root"
      - name: Rebuild exact v213 source, produce and verify full v175 delta
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo=$env:GITHUB_WORKSPACE
          $root=$env:HIGI_SRC
          $script=@'
          import base64,hashlib,json,lzma,pathlib,sys
          root=pathlib.Path(sys.argv[1]); dest=pathlib.Path(sys.argv[2])
          cfg=json.loads((root/'cloud-releases/v0.15.212-DRY.json').read_text())
          assert cfg['version']=='0.15.212' and cfg['versionCode']==362
          raw=lzma.decompress(base64.b64decode(''.join((root/cfg['patchFile']).read_text().split()),validate=True))
          assert hashlib.sha256(raw).hexdigest()==cfg['patchSha256']
          (dest/'v212.patch').write_bytes(raw)
          raw=lzma.decompress(base64.b64decode(''.join((root/'cloud-tests/v213/overlay-u0.patch.xz.b64').read_text().split()),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='1f002113485fdb017f78b1c084922cf6183672e5e784bd1c75e0b30cf76d702b'
          (dest/'v213-overlay.patch').write_bytes(raw)
          '@
          $scriptFile=Join-Path $env:RUNNER_TEMP 'restore-higi-v213.py'
          [IO.File]::WriteAllText($scriptFile,$script)
          & python $scriptFile $repo $env:RUNNER_TEMP
          if($LASTEXITCODE -ne 0){throw 'Verified deltas unavailable'}
          & git -C $root init -q
          & git -C $root add -A
          & git -C $root -c user.name=Higi -c user.email=higi@localhost commit -qm sealed-v175
          if($LASTEXITCODE -ne 0){throw 'Could not pin v175'}
          & git -C $root apply --check (Join-Path $env:RUNNER_TEMP 'v212.patch')
          if($LASTEXITCODE -ne 0){throw 'v212 mismatch'}
          & git -C $root apply (Join-Path $env:RUNNER_TEMP 'v212.patch')
          & git -C $root add -A
          & git -C $root -c user.name=Higi -c user.email=higi@localhost commit -qm verified-v212
          if($LASTEXITCODE -ne 0){throw 'Could not pin v212'}
          & git -C $root apply --unidiff-zero --check (Join-Path $env:RUNNER_TEMP 'v213-overlay.patch')
          if($LASTEXITCODE -ne 0){throw 'v213 overlay mismatch'}
          & git -C $root apply --unidiff-zero (Join-Path $env:RUNNER_TEMP 'v213-overlay.patch')
          if($LASTEXITCODE -ne 0){throw 'v213 overlay apply failure'}
          $version=Join-Path $root 'app/build.gradle.kts'
          $contents=[IO.File]::ReadAllText($version)
          if(!$contents.Contains('versionCode = 362') -or !$contents.Contains('versionName = "0.15.212"')){throw 'Unexpected baseline version'}
          $contents=$contents.Replace('versionCode = 362','versionCode = 363').Replace('versionName = "0.15.212"','versionName = "0.15.213"')
          [IO.File]::WriteAllText($version,$contents)
          & python (Join-Path $root 'tools/sync-release-version.py') --write --root $root
          & python (Join-Path $root 'tools/sync-release-version.py') --check --root $root
          if($LASTEXITCODE -ne 0){throw 'Version metadata mismatch'}
          & git -C $root add -N -A
          $changed=@(& git -C $root diff --name-only HEAD)
          $allowed=@('app/build.gradle.kts','app/src/main/java/com/example/hebrewcrossword/AdminAiPromptDiagnostic.kt','app/src/main/java/com/example/hebrewcrossword/AdminAiWordLengthsDialog.kt','app/src/main/java/com/example/hebrewcrossword/AdminLocalOcrLengthV213.kt','app/src/main/java/com/example/hebrewcrossword/RecentCrosswordsActivity.kt','firebase/public/app-version.json','firebase/public/update/index.html')
          if($changed.Count -ne 7 -or @($changed|Where-Object{$_ -notin $allowed}).Count -ne 0){throw "Unexpected changed files: $($changed -join ',')"}
          $patch=Join-Path $env:RUNNER_TEMP 'higi213-full.patch'
          & git -C $root diff --binary "--output=$patch" HEAD~1
          if($LASTEXITCODE -ne 0 -or !(Test-Path $patch)){throw 'Patch export failed'}
          $make=@'
          import base64,hashlib,json,lzma,pathlib,sys
          repo=pathlib.Path(sys.argv[1]); src=pathlib.Path(sys.argv[2])
          raw=src.read_bytes()
          assert 10000<len(raw)<3000000, 'Unsafe generated source delta size'
          p=repo/'cloud-patches/v0.15.213-from-v0.15.175.patch.xz.b64'
          assert not p.exists()
          p.write_text(base64.b64encode(lzma.compress(raw,preset=9)).decode()+'\n')
          cfg={'channel':'dry','version':'0.15.213','versionCode':363,
             'patchFile':str(p.relative_to(repo)), 'patchSha256':hashlib.sha256(raw).hexdigest(),
             'notes':'Administrator-only DRY: source-only independent local Tesseract word-length cross-check for Maariv Oded Rosen; CSV and ZIP save actions in native dialog footer; Downloads save verification; compare and flag OCR disagreements without automatic corrections. No Canonical or Firebase deployment. Frozen Dekel Monday and Wednesday OCR and other production algorithms unchanged. On-device review still required.'}
          m=repo/'cloud-releases/v0.15.213-DRY.json'
          assert not m.exists()
          m.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n')
          print('V213_GENERATED_PATCH_SHA256',cfg['patchSha256'])
          '@
          $makePath=Join-Path $env:RUNNER_TEMP 'make-higi213.py'
          [IO.File]::WriteAllText($makePath,$make)
          & python $makePath $repo $patch
          if($LASTEXITCODE -ne 0){throw 'Could not generate immutable v213 release patch'}
          & git -C $root reset --hard HEAD~1
          if($LASTEXITCODE -ne 0){throw 'Cannot restore pinned v175'}
          & git -C $root clean -fdq
          & git -C $root apply --check $patch
          if($LASTEXITCODE -ne 0){throw 'Final v175-to-v213 patch does not reapply'}
          & git -C $root apply $patch
          & python (Join-Path $root 'tools/sync-release-version.py') --check --root $root
          if($LASTEXITCODE -ne 0){throw 'Final reconstructed version mismatch'}
          Write-Host 'V213_FULL_SOURCE_PATCH_RECONSTRUCTS_AND_ISOLATED_SCOPE_PASS'
      - name: Commit staged v213 source delta and manifest to main
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-Location $env:GITHUB_WORKSPACE
          & git fetch origin main
          if($LASTEXITCODE -ne 0){throw 'Cannot fetch main'}
          & git checkout -B main origin/main
          if($LASTEXITCODE -ne 0){throw 'Cannot switch to latest main'}
          & git add cloud-patches/v0.15.213-from-v0.15.175.patch.xz.b64 cloud-releases/v0.15.213-DRY.json
          if($LASTEXITCODE -ne 0){throw 'Could not stage v213 files'}
          & git -c user.name=Higi -c user.email=higi@localhost commit -m 'Stage signed-QA-validated Higi 0.15.213 DRY source and manifest'
          if($LASTEXITCODE -ne 0){throw 'Cannot commit v213 manifest'}
          & git push origin HEAD:main
          if($LASTEXITCODE -ne 0){throw 'GitHub main push failed: no release'}
          Write-Host 'V213_SOURCE_STAGED_MAIN'
      - name: Dispatch the existing signed Android DRY publisher
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & gh workflow run higi-cloud-dry-release.yml --repo $env:REPO --ref main -f manifest_file=cloud-releases/v0.15.213-DRY.json
          if($LASTEXITCODE -ne 0){throw 'Could not dispatch official Android DRY publisher'}
          Write-Host 'V213_SIGNED_ANDROID_PUBLISHER_DISPATCHED'
