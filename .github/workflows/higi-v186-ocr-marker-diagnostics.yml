name: Higi v186 OCR marker diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/higi-v186-ocr-marker-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Recover pinned source and inspect only OCR marker expressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diag"
          curl --silent --show-error --fail --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/octet-stream" \
            --output "$RUNNER_TEMP/diag/base.zip" \
            "https://api.github.com/repos/higicrossword/Higi-Releases/releases/assets/720424907"
          echo 'ad14647edf7facd1d20309cfd2ae48cca779288ad06488c4d80b2404d8933dd7' "$RUNNER_TEMP/diag/base.zip" | sha256sum -c --status
          unzip -q "$RUNNER_TEMP/diag/base.zip" -d "$RUNNER_TEMP/diag/source"
          export ROOT="$RUNNER_TEMP/diag/source/HebrewCrosswordApp_v0.15.175"
          python - "$GITHUB_WORKSPACE/cloud-patches/v0.15.186-from-v0.15.175.patch.xz.b64" "$RUNNER_TEMP/diag/code.patch" <<'PY'
          import base64,hashlib,lzma,pathlib,sys
          raw=lzma.decompress(base64.b64decode(pathlib.Path(sys.argv[1]).read_text().strip(),validate=True))
          assert hashlib.sha256(raw).hexdigest()=="ae9b8516e5ba9a2f93916bbdd89e3671aaa1dd4d09adf452eeedc91e0ac140a0"
          pathlib.Path(sys.argv[2]).write_bytes(raw)
          PY
          (cd "$ROOT"; git apply --check "$RUNNER_TEMP/diag/code.patch"; git apply "$RUNNER_TEMP/diag/code.patch")
          python - <<'PY'
          import os,pathlib,re
          p=pathlib.Path(os.environ["ROOT"])/"app/src/main/java/com/example/hebrewcrossword"
          fn="OcrInlineClueRecoveryV180.kt"
          lines=(p/fn).read_text().splitlines()
          pats=("Regex(","marker","punctuation","parseAnchor","parseNumber","token","printed","stale","recover","residual")
          print("========== OCR MARKER LINES (NO SECRET CONFIG) ==========")
          for i,s in enumerate(lines):
              if any(t.lower() in s.lower() for t in pats) and ("Regex(" in s or "marker" in s.lower() or "anchor" in s.lower() or "punctuation" in s.lower() or "parseNumber" in s):
                  print(f"{i+1}: {s[:170]}")
          print("========== FILE LENGTH ==========")
          print(fn,len(lines))
          PY
