name: Higi active OCR promotion read-only investigation
on:
  push:
    branches: ['feature/ocr-promote-3series-v212']
    paths: ['.github/workflows/higi-ocr-promotion-audit.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ocr-promote-3series-v212
      - name: reconstruct and inspect v212 crop pipeline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/higi-ocr
          curl --silent --show-error --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o /tmp/higi-ocr/base.zip \
            "https://api.github.com/repos/higicrossword/Higi-Releases/releases/assets/720424907"
          echo 'ad14647edf7facd1d20309cfd2ae48cca779288ad06488c4d80b2404d8933dd7  /tmp/higi-ocr/base.zip' | sha256sum -c -
          unzip -q /tmp/higi-ocr/base.zip -d /tmp/higi-ocr
          ROOT=/tmp/higi-ocr/HebrewCrosswordApp_v0.15.175
          git -C "$ROOT" init -q
          git -C "$ROOT" add -A
          git -C "$ROOT" -c user.name=Audit -c user.email=audit@localhost commit -qm baseline
          python3 - <<'PY'
          import base64,lzma,hashlib,json,pathlib
          cfg=json.loads(pathlib.Path('cloud-releases/v0.15.212-DRY.json').read_text())
          raw=lzma.decompress(base64.b64decode(''.join(pathlib.Path(cfg['patchFile']).read_text().split()),validate=True))
          assert hashlib.sha256(raw).hexdigest()==cfg['patchSha256']
          pathlib.Path('/tmp/higi-ocr/v212.patch').write_bytes(raw)
          PY
          git -C "$ROOT" apply /tmp/higi-ocr/v212.patch
          git -C "$ROOT" add -A
          git -C "$ROOT" -c user.name=Audit -c user.email=audit@localhost commit -qm v212
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/higi-ocr/HebrewCrosswordApp_v0.15.175')
          p=root/'app/src/main/java/com/example/hebrewcrossword'
          for name,ranges in [
            ('HigiLocalOcrCropEngine.kt',[(635,825)]),
            ('LocalOcrCropPass.kt',[(1,195)]),
            ('OcrSeriesPreviewV197.kt',[(1,210)]),
            ('AdminOcrRecropActivity.kt',[(285,360),(480,570),(920,990)]),
            ('OcrWeeklySourceAnchorsV199.kt',[(1,105),(195,225)]),
            ('MainActivity.kt',[(1170,1230),(3890,3940)]),
          ]:
            fp=p/name
            if not fp.exists():continue
            lines=fp.read_text().splitlines()
            print('=== SOURCE',name,len(lines))
            for lo,hi in ranges:
              print('--- RANGE',lo,hi)
              for i in range(lo-1,min(hi,len(lines))):
                print(f'{i+1:05d} {lines[i][:280]}')
          PY

      - name: Inspect crop evidence and downstream use sites
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          b=Path('/tmp/higi-ocr/HebrewCrosswordApp_v0.15.175/app/src/main/java/com/example/hebrewcrossword')
          for n in ['ClueGeometryEvidencePolicy.kt','ClueGeometry.kt','ClueRegionStore.kt','OcrWeeklyCropRepairV208.kt','OcrWeeklySourceAnchorsV199.kt','OcrWeeklyOverlapReviewV200.kt','HigiLocalOcrCropEngine.kt','MainActivity.kt']:
            p=b/n
            if not p.exists():continue
            l=p.read_text().splitlines()
            print('## FILE',n,len(l))
            if n in ('ClueGeometryEvidencePolicy.kt','ClueGeometry.kt','OcrWeeklyCropRepairV208.kt','OcrWeeklyOverlapReviewV200.kt'):
              for i,line in enumerate(l[:170],1):print(f'{i:05d} {line[:265]}')
            elif n=='HigiLocalOcrCropEngine.kt':
              for i,line in enumerate(l[:120],1):print(f'{i:05d} {line[:265]}')
              for i in range(815,min(len(l),845)):print(f'{i+1:05d} {l[i][:265]}')
            elif n=='ClueRegionStore.kt':
              for i,line in enumerate(l):
                if 'fun putVerified' in line or 'fun getVerified' in line or 'hasManualOverride' in line:
                  for j in range(max(0,i-1),min(len(l),i+5)):
                    print(f'{j+1:05d} {l[j][:265]}')
            elif n=='MainActivity.kt':
              for i,line in enumerate(l):
                if 'LocalOcrCropPass.run(' in line or 'enrichClueGeometry(' in line:
                  for j in range(max(0,i-7),min(len(l),i+8)):
                    print(f'{j+1:05d} {l[j][:265]}')
          PY

      - name: Apply guarded three-series integration and verify narrow source diff
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/higi-ocr/HebrewCrosswordApp_v0.15.175
          python3 cloud-tests/ocr-series-promotion-v213/activate-v212-staged.py "$ROOT"
          git -C "$ROOT" add -N -A
          git -C "$ROOT" diff --check
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          root=Path('/tmp/higi-ocr/HebrewCrosswordApp_v0.15.175')
          names=set(subprocess.check_output(['git','-C',str(root),'diff','--name-only'],text=True).splitlines())
          expected={
          'app/src/main/java/com/example/hebrewcrossword/MainActivity.kt',
          'app/src/main/java/com/example/hebrewcrossword/AdminLibraryRedecodeRunner.kt',
          'app/src/main/java/com/example/hebrewcrossword/OcrSeriesActivationV213.kt',
          'app/src/test/java/com/example/hebrewcrossword/OcrSeriesActivationV213Test.kt'
          }
          assert names==expected,('Unexpected source changes',sorted(names.symmetric_difference(expected)))
          for file in ['HigiLocalOcrCropEngine.kt','OcrWeeklySourceAnchorsV199.kt','OcrWeeklyFinalGeometryV201.kt','OcrWeeklyCropRepairV208.kt','LocalOcrCropPass.kt','HafuchGridTemplate.kt']:
              assert 'app/src/main/java/com/example/hebrewcrossword/'+file not in names,file
          print('PASS four-file-only guarded integration; frozen OCR engines untouched')
          PY
          git -C "$ROOT" diff --binary > /tmp/higi-ocr/ocr-v213-staged.patch
          sha256sum /tmp/higi-ocr/ocr-v213-staged.patch
      - name: Compile and run Android JVM tests without publishing
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/higi-ocr/HebrewCrosswordApp_v0.15.175
          cd "$ROOT"
          gradle --no-daemon -PhigiDryBuild=true :app:testDebugUnitTest :app:assembleDebug > /tmp/higi-ocr/gradle.log 2>&1 || {
            tail -110 /tmp/higi-ocr/gradle.log
            exit 1
          }
          tail -35 /tmp/higi-ocr/gradle.log
          echo "DRY_COMPILE_PASS; NO APK RELEASE OR CANONICAL WRITE"

      - name: Inspect downstream crop selection and evidence for safe active promotion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/higi-ocr/HebrewCrosswordApp_v0.15.175')
          b=root/'app/src/main/java/com/example/hebrewcrossword'
          look=[
            ('HigiLocalOcrCropEngine.kt',[(95,145),(285,345),(500,560),(725,845)]),
            ('OcrWeeklySourceAnchorsV199.kt',[(25,120),(120,225)]),
            ('OcrWeeklyCropRepairV208.kt',[(110,185)]),
            ('MainActivity.kt',[(3900,3955),(4050,4100)]),
            ('AdminLibraryRedecodeRunner.kt',[(110,260)]),
            ('ClueRegionStore.kt',[(125,172)]),
            ('AdminOcrRecropActivity.kt',[(360,455),(785,985)])
          ]
          for name,ranges in look:
            p=b/name
            if not p.exists():continue
            lines=p.read_text().splitlines()
            print('===== SELECTED',name)
            for lo,hi in ranges:
              for i in range(lo-1,min(hi,len(lines))):
                print(f'{i+1:05d} {lines[i][:315]}')
          PY
