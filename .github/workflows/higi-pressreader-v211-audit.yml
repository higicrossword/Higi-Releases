name: Higi v211 PressReader reconstructed-source read-only audit
on:
  push:
    branches: ['analysis/pressreader-v211-20261120']
    paths: ['.github/workflows/higi-pressreader-v211-audit.yml', 'cloud-tests/hafuch-grid-fallback-wip/hafuch-v211-rescue-dry.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified full source and examine parser context
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/higiaudit
          curl --silent --show-error --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o /tmp/higiaudit/base.zip \
            "https://api.github.com/repos/higicrossword/Higi-Releases/releases/assets/720424907"
          echo 'ad14647edf7facd1d20309cfd2ae48cca779288ad06488c4d80b2404d8933dd7  /tmp/higiaudit/base.zip' | sha256sum -c -
          unzip -q /tmp/higiaudit/base.zip -d /tmp/higiaudit
          ROOT=/tmp/higiaudit/HebrewCrosswordApp_v0.15.175
          git -C "$ROOT" init -q
          git -C "$ROOT" add -A
          git -C "$ROOT" -c user.name=Audit -c user.email=audit@localhost commit -qm base
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib
          cfg=json.loads(pathlib.Path('cloud-releases/v0.15.211-DRY.json').read_text())
          patch=lzma.decompress(base64.b64decode(pathlib.Path(cfg['patchFile']).read_text().strip()))
          assert hashlib.sha256(patch).hexdigest()==cfg['patchSha256']
          pathlib.Path('/tmp/higiaudit/v211.patch').write_bytes(patch)
          print('PATCH_VERIFIED',len(patch))
          PY
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/higiaudit/HebrewCrosswordApp_v0.15.175')

          print('---- OTHER_DIAGNOSTICS ----')
          for relative,lo,hi in [
              ('app/src/main/java/com/example/hebrewcrossword/OpenAiWorkerClient.kt',125,205),
              ('app/src/main/java/com/example/hebrewcrossword/MainActivity.kt',3700,3830),
          ]:
              p=root/relative
              print('CONTEXT',relative,'exists',p.exists())
              if p.exists():
                  ls=p.read_text(errors='replace').splitlines()
                  for i in range(lo-1,min(hi,len(ls))):
                      print(f'{i+1:05d} {ls[i][:300]}')
          needles=['HAFUCH_DEKEL','HafuchGrid','hafuchGrid','fallbackGrid','fallback-grid','fingerprint','refinementSource','source-image-size']
          matches=[]
          for p in (root/'app/src/main/java').rglob('*.kt'):
              for i,line in enumerate(p.read_text(errors='replace').splitlines(),1):
                  if any(n in line for n in needles) and not p.name.startswith('MainActivity'):
                      matches.append((str(p.relative_to(root)),i,line.strip()))
          print('SOURCE_SEARCH_TOTAL',len(matches))
          for path,line,s in matches[:75]:
              print('SOURCE_SEARCH',path,line,s[:180])
          PY
          git -C "$ROOT" apply --check /tmp/higiaudit/v211.patch
          git -C "$ROOT" apply /tmp/higiaudit/v211.patch
          echo 'RECONSTRUCTED_VERSION:'
          grep -E 'versionCode = |versionName = ' "$ROOT/app/build.gradle.kts" | head -4
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/higiaudit/HebrewCrosswordApp_v0.15.175')
          found=[]
          for p in (root/'app/src').rglob('*'):
              if p.is_file() and p.suffix.lower() in ('.kt','.java','.xml'):
                  s=p.read_text(errors='replace')
                  if 'pressreader-bidi-tuple-shape' in s or 'bidi-tuple-shape' in s:
                      found.append((p,s))
          print('EXACT_MATCH_FILE_COUNT',len(found))
          for p,s in found:
              print('SOURCE_PATH',p.relative_to(root))
              lines=s.splitlines()
              matches=[i for i,x in enumerate(lines) if 'pressreader-bidi-tuple-shape' in x or 'bidi-tuple-shape' in x]
              for i in matches:
                  print('GUARD_LINE',i+1)
                  for j in range(max(0,i-90),min(len(lines),i+95)):
                      print(f'{j+1:05d} {lines[j][:320]}')
          if not found:
              print('PRESSREADER_RELATED_PATHS')
              for p in (root/'app/src').rglob('*'):
                  if p.is_file() and p.suffix in ('.kt','.java'):
                      if any(x in p.name.lower() for x in ('press','structured','israel')):
                          print(p.relative_to(root))
          PY

          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/higiaudit/HebrewCrosswordApp_v0.15.175')
          base='app/src/main/java/com/example/hebrewcrossword/'
          files=[('MainActivity.kt',3570,3712),('WeeklyGridSanity.kt',1,260),('GridRefinement.kt',1,240),('GridConsistency.kt',1,220),('HafuchGridFallback.kt',1,240)]
          for name,start,end in files:
              p=root/base/name
              print('==== SOURCE_FILE',name,'exists',p.is_file(),'====')
              if p.is_file():
                  lines=p.read_text().splitlines()
                  for i in range(start-1,min(end,len(lines))):
                      print(f'{i+1:05d} {lines[i][:280]}')
          print('==== CLASS_MATCHES ====')
          for p in (root/base).rglob('*.kt'):
              s=p.read_text(errors='replace')
              if 'class WeeklyGridSanity' in s or 'object WeeklyGridSanity' in s or 'class GridRefinement' in s or 'object GridRefinement' in s or 'class Hafuch' in s or 'object Hafuch' in s:
                  print('CLASS_PATH',p.relative_to(root))
          PY

          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/higiaudit/HebrewCrosswordApp_v0.15.175')
          for name in ['HafuchAdminSourceGridV1.kt','GridDetector.kt']:
              p=root/'app/src/main/java/com/example/hebrewcrossword'/name
              print('==== CRITICAL',name,p.exists())
              if p.exists():
                  ls=p.read_text().splitlines()
                  for i,line in enumerate(ls[:300]):
                      if name=='GridDetector.kt' and i>140:break
                      print(f'{i+1:05d} {line[:260]}')
          p=root/'app/src/main/java/com/example/hebrewcrossword/MainActivity.kt'
          ls=p.read_text().splitlines()
          for i in range(3710,min(3750,len(ls))):
              print(f'MAIN_PREPARE {i+1:05d} {ls[i][:300]}')
          PY

          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/higiaudit/HebrewCrosswordApp_v0.15.175')
          base=root/'app/src/main/java/com/example/hebrewcrossword'
          for name,ranges in [('MainActivity.kt',[(3710,3710+80)]),('CrosswordCatalog.kt',[(1,100)]),('HafuchAdminSourceGridV1.kt',[(1,80)])]:
              p=base/name
              print('==== TARGET',name)
              lines=p.read_text().splitlines()
              for lo,hi in ranges:
                  for j in range(lo-1,min(hi,len(lines))):
                      print(f'{j+1:05d} {lines[j][:260]}')
          print('HAFUCH_TEMPLATE_CALLS')
          for p in base.rglob('*.kt'):
              for i,line in enumerate(p.read_text(errors='replace').splitlines(),1):
                  if 'HafuchAdminSourceGridV1' in line:
                      print(p.name,i,line.strip()[:250])
          PY

      - name: Apply isolated HAFUCH rescue in reconstructed temporary tree and run JVM tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/higiaudit/HebrewCrosswordApp_v0.15.175
          git -C "$ROOT" add -A
          git -C "$ROOT" -c user.name=Audit -c user.email=audit@localhost commit -qm "verified reconstructed v211 baseline"
          python3 cloud-tests/hafuch-grid-fallback-wip/hafuch-v211-rescue-dry.py "$ROOT"
          git -C "$ROOT" diff --check
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root='/tmp/higiaudit/HebrewCrosswordApp_v0.15.175'
          names=subprocess.check_output(['git','-C',root,'diff','--name-only'],text=True).splitlines()
          expected={'app/src/main/java/com/example/hebrewcrossword/HafuchAdminSourceGridV1.kt','app/src/main/java/com/example/hebrewcrossword/MainActivity.kt'}
          assert set(names)==expected,(names,expected)
          main=Path(root,'app/src/main/java/com/example/hebrewcrossword/MainActivity.kt').read_text()
          assert 'fromCanonicalTitle(cleanSuggested.orEmpty())?.id=="HAFUCH_DEKEL"' in main
          assert 'verifiedLocated(original)' in main
          assert 'hafuchVerified!=null || located.variant.startsWith("template-")' in main
          print('PASS isolated HAFUCH series guard and pixel verification')
          PY
          cd "$ROOT"
          gradle --no-daemon -PhigiDryBuild=true :app:testDebugUnitTest :app:assembleDebug > /tmp/higiaudit/gradle.log 2>&1 || {
            tail -130 /tmp/higiaudit/gradle.log
            exit 1
          }
          tail -30 /tmp/higiaudit/gradle.log
          echo "DRY_VERIFIED_ONLY_NO_RELEASE_NO_CANONICAL_WRITE"
