name: Higi v211 PressReader reconstructed-source read-only audit
on:
  push:
    branches: ['analysis/pressreader-v211-20261120']
    paths: ['.github/workflows/higi-pressreader-v211-audit.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified full source and examine parser context
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/higiaudit
          curl --silent --show-error --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o /tmp/higiaudit/base.zip \
            "https://api.github.com/repos/higicrossword/Higi-Releases/releases/assets/720424907"
          echo 'ad14647edf7facd1d20309cfd2ae48cca779288ad06488c4d80b2404d8933dd7  /tmp/higiaudit/base.zip' | sha256sum -c -
          unzip -q /tmp/higiaudit/base.zip -d /tmp/higiaudit
          ROOT=/tmp/higiaudit/HebrewCrosswordApp_v0.15.175
          git -C "$ROOT" init -q
          git -C "$ROOT" add -A
          git -C "$ROOT" -c user.name=Audit -c user.email=audit@localhost commit -qm base
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib
          cfg=json.loads(pathlib.Path('cloud-releases/v0.15.211-DRY.json').read_text())
          patch=lzma.decompress(base64.b64decode(pathlib.Path(cfg['patchFile']).read_text().strip()))
          assert hashlib.sha256(patch).hexdigest()==cfg['patchSha256']
          pathlib.Path('/tmp/higiaudit/v211.patch').write_bytes(patch)
          print('PATCH_VERIFIED',len(patch))
          PY
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/higiaudit/HebrewCrosswordApp_v0.15.175')

          print('---- OTHER_DIAGNOSTICS ----')
          for relative,lo,hi in [
              ('app/src/main/java/com/example/hebrewcrossword/OpenAiWorkerClient.kt',125,205),
              ('app/src/main/java/com/example/hebrewcrossword/MainActivity.kt',3700,3830),
          ]:
              p=root/relative
              print('CONTEXT',relative,'exists',p.exists())
              if p.exists():
                  ls=p.read_text(errors='replace').splitlines()
                  for i in range(lo-1,min(hi,len(ls))):
                      print(f'{i+1:05d} {ls[i][:300]}')
          needles=['HAFUCH_DEKEL','HafuchGrid','hafuchGrid','fallbackGrid','fallback-grid','fingerprint','refinementSource','source-image-size']
          matches=[]
          for p in (root/'app/src/main/java').rglob('*.kt'):
              for i,line in enumerate(p.read_text(errors='replace').splitlines(),1):
                  if any(n in line for n in needles) and not p.name.startswith('MainActivity'):
                      matches.append((str(p.relative_to(root)),i,line.strip()))
          print('SOURCE_SEARCH_TOTAL',len(matches))
          for path,line,s in matches[:75]:
              print('SOURCE_SEARCH',path,line,s[:180])
          PY
          git -C "$ROOT" apply --check /tmp/higiaudit/v211.patch
          git -C "$ROOT" apply /tmp/higiaudit/v211.patch
          echo 'RECONSTRUCTED_VERSION:'
          grep -E 'versionCode = |versionName = ' "$ROOT/app/build.gradle.kts" | head -4
          python3 - <<'PY'
          from pathlib import Path
          root=Path('/tmp/higiaudit/HebrewCrosswordApp_v0.15.175')
          found=[]
          for p in (root/'app/src').rglob('*'):
              if p.is_file() and p.suffix.lower() in ('.kt','.java','.xml'):
                  s=p.read_text(errors='replace')
                  if 'pressreader-bidi-tuple-shape' in s or 'bidi-tuple-shape' in s:
                      found.append((p,s))
          print('EXACT_MATCH_FILE_COUNT',len(found))
          for p,s in found:
              print('SOURCE_PATH',p.relative_to(root))
              lines=s.splitlines()
              matches=[i for i,x in enumerate(lines) if 'pressreader-bidi-tuple-shape' in x or 'bidi-tuple-shape' in x]
              for i in matches:
                  print('GUARD_LINE',i+1)
                  for j in range(max(0,i-90),min(len(lines),i+95)):
                      print(f'{j+1:05d} {lines[j][:320]}')
          if not found:
              print('PRESSREADER_RELATED_PATHS')
              for p in (root/'app/src').rglob('*'):
                  if p.is_file() and p.suffix in ('.kt','.java'):
                      if any(x in p.name.lower() for x in ('press','structured','israel')):
                          print(p.relative_to(root))
          PY
