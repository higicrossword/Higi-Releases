name: Higi v208 source handoff for emulator testing
on:
  push:
    branches: [main]
    paths: ['.github/workflows/higi-v209-source-handoff.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild signed v208 source from pinned v175 archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/higi"
          curl --silent --show-error --fail --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$RUNNER_TEMP/higi/base.zip" \
            "https://api.github.com/repos/higicrossword/Higi-Releases/releases/assets/720424907"
          echo "ad14647edf7facd1d20309cfd2ae48cca779288ad06488c4d80b2404d8933dd7  $RUNNER_TEMP/higi/base.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/higi/base.zip" -d "$RUNNER_TEMP/higi"
          ROOT="$RUNNER_TEMP/higi/HebrewCrosswordApp_v0.15.175"
          python3 - "$GITHUB_WORKSPACE" "$RUNNER_TEMP/higi" <<'PY'
          import base64,lzma,json,hashlib,pathlib,sys
          repo=pathlib.Path(sys.argv[1]);out=pathlib.Path(sys.argv[2])
          obj=json.loads((repo/'cloud-releases/v0.15.208-DRY.json').read_text())
          raw=lzma.decompress(base64.b64decode((repo/obj['patchFile']).read_text().strip(),validate=True))
          assert hashlib.sha256(raw).hexdigest()==obj['patchSha256']
          (out/'v208.patch').write_bytes(raw)
          PY
          git -C "$ROOT" init -q
          git -C "$ROOT" add -A
          git -C "$ROOT" -c user.email=higi@localhost -c user.name=Higi commit -qm "baseline"
          git -C "$ROOT" apply --check "$RUNNER_TEMP/higi/v208.patch"
          git -C "$ROOT" apply "$RUNNER_TEMP/higi/v208.patch"
          grep -q 'versionCode = 358' "$ROOT/app/build.gradle.kts"
          cd "$ROOT"
          zip -q -r "$GITHUB_WORKSPACE/higi-v208-reconstructed-source.zip" . -x '.git/*' '.gradle/*' 'app/build/*'
          sha256sum "$GITHUB_WORKSPACE/higi-v208-reconstructed-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: higi-v208-source-for-emulator
          path: higi-v208-reconstructed-source.zip
          retention-days: 3
          if-no-files-found: error
