name: Higi 0.15.197 - series OCR profiles and swipe UI source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/higi-generate-v197.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: higi-v197-patch-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: higicrossword/Higi-Releases
      BASE_SHA: ad14647edf7facd1d20309cfd2ae48cca779288ad06488c4d80b2404d8933dd7
      PREV_PATCH_SHA: 8aadda20fe58a341100d0ff7aeb825466e64b3e6c08f75a0f2ace99d8d24a445
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct pinned v196 and apply isolated v197 changes
        shell: bash
        run: |
          set -euo pipefail
          ! gh release view v0.15.197-DRY --repo "$REPO" --json tagName >/dev/null 2>&1 || { echo 'v197 release exists'; exit 1; }
          mkdir -p "$RUNNER_TEMP/v197"
          curl --silent --show-error --fail --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/octet-stream' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$RUNNER_TEMP/v197/base.zip" \
            "https://api.github.com/repos/$REPO/releases/assets/720424907"
          echo "$BASE_SHA  $RUNNER_TEMP/v197/base.zip" | sha256sum --check --status
          unzip -q "$RUNNER_TEMP/v197/base.zip" -d "$RUNNER_TEMP/v197/source"
          ROOT="$RUNNER_TEMP/v197/source/HebrewCrosswordApp_v0.15.175"
          test -f "$ROOT/app/build.gradle.kts"
          git -C "$ROOT" init -q
          git -C "$ROOT" add -A
          git -C "$ROOT" -c user.name='Higi build' -c user.email='higi-build@users.noreply.github.com' commit -qm 'pinned v175'
          python - "$GITHUB_WORKSPACE/cloud-patches/v0.15.196-from-v0.15.175.patch.xz.b64" "$RUNNER_TEMP/v197/v196.patch" "$PREV_PATCH_SHA" <<'PY'
          import base64,hashlib,lzma,pathlib,sys
          raw=lzma.decompress(base64.b64decode(pathlib.Path(sys.argv[1]).read_text().strip(),validate=True))
          assert hashlib.sha256(raw).hexdigest()==sys.argv[3],'v196 patch SHA mismatch'
          pathlib.Path(sys.argv[2]).write_bytes(raw)
          PY
          git -C "$ROOT" apply --check "$RUNNER_TEMP/v197/v196.patch"
          git -C "$ROOT" apply "$RUNNER_TEMP/v197/v196.patch"
          grep -q 'versionCode = 346' "$ROOT/app/build.gradle.kts"
          grep -q 'versionName = "0.15.196"' "$ROOT/app/build.gradle.kts"
          git -C "$ROOT" add -A
          git -C "$ROOT" -c user.name='Higi build' -c user.email='higi-build@users.noreply.github.com' commit -qm 'pinned v196'
          python "$GITHUB_WORKSPACE/cloud-tools/cloud-v197-apply.py" "$ROOT"
          python "$ROOT/tools/sync-release-version.py" --write --root "$ROOT"
          python "$ROOT/tools/sync-release-version.py" --check --root "$ROOT"
          grep -q 'versionCode = 347' "$ROOT/app/build.gradle.kts"
          grep -q 'versionName = "0.15.197"' "$ROOT/app/build.gradle.kts"
          grep -q 'layoutSeriesId=series.id' "$ROOT/app/src/main/java/com/example/hebrewcrossword/AdminOcrRecropActivity.kt"
          grep -q 'OcrSeriesPreviewV197.inspect' "$ROOT/app/src/main/java/com/example/hebrewcrossword/HigiLocalOcrCropEngine.kt"
          grep -q 'onHorizontalSwipe' "$ROOT/app/src/main/java/com/example/hebrewcrossword/AdminOcrSelectedCropView.kt"
          git -C "$ROOT" add -N -A
          git -C "$ROOT" diff HEAD~1 --binary > "$RUNNER_TEMP/v197/v197.patch"
          test -s "$RUNNER_TEMP/v197/v197.patch"
          git -C "$ROOT" reset --hard -q HEAD~1
          git -C "$ROOT" clean -fdq
          git -C "$ROOT" apply --check "$RUNNER_TEMP/v197/v197.patch"
          git -C "$ROOT" apply "$RUNNER_TEMP/v197/v197.patch"
          python "$ROOT/tools/sync-release-version.py" --check --root "$ROOT"
          python - "$RUNNER_TEMP/v197/v197.patch" "$GITHUB_WORKSPACE" <<'PY'
          import base64,hashlib,json,lzma,pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_bytes()
          root=pathlib.Path(sys.argv[2])
          name='cloud-patches/v0.15.197-from-v0.15.175.patch.xz.b64'
          manifest=root/'cloud-releases/v0.15.197-DRY.json'
          assert not (root/name).exists() and not manifest.exists(), 'v197 already staged'
          (root/name).write_text(base64.b64encode(lzma.compress(raw,preset=9)).decode()+'\n')
          cfg={'channel':'dry','version':'0.15.197','versionCode':347,'patchFile':name,
               'patchSha256':hashlib.sha256(raw).hexdigest(),
               'notes':'V197: series-specific OCR DRY preview, horizontal swipe between clues, compact labeled controls. Tartey/Hafuch paths unchanged; never auto-write Canonical.'}
          manifest.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n')
          print('v197 patch sha256',cfg['patchSha256'])
          PY
      - name: Commit source patch only; DRY build gated by Gradle regression tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name higicrossword
          git config user.email higicrossword@users.noreply.github.com
          git add cloud-patches/v0.15.197-from-v0.15.175.patch.xz.b64 cloud-releases/v0.15.197-DRY.json
          git commit -m 'Stage Higi v0.15.197 DRY series OCR and swipe UI'
          git push origin HEAD:main
