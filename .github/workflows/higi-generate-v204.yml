name: Higi 0.15.204 - canonical source-image viewer and swap
on:
  push:
    branches: [main]
    paths: ['.github/workflows/higi-generate-v204.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: higi-v204-patch-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: higicrossword/Higi-Releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct v202 then v203 and corrected v204 image change
        shell: bash
        run: |
          set -euo pipefail
          test ! -e cloud-releases/v0.15.204-DRY.json
          WORK="$RUNNER_TEMP/higi-v204"
          mkdir -p "$WORK"
          curl --silent --show-error --fail --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$WORK/base.zip" \
            "https://api.github.com/repos/$REPO/releases/assets/720424907"
          echo "ad14647edf7facd1d20309cfd2ae48cca779288ad06488c4d80b2404d8933dd7  $WORK/base.zip" | sha256sum --check
          unzip -q "$WORK/base.zip" -d "$WORK/source"
          ROOT="$WORK/source/HebrewCrosswordApp_v0.15.175"
          test -f "$ROOT/app/build.gradle.kts"
          git -C "$ROOT" init -q
          git -C "$ROOT" add -A
          git -C "$ROOT" -c user.name='Higi builder' -c user.email='higi-builder@users.noreply.github.com' commit -qm 'pinned v175'
          python3 - "$GITHUB_WORKSPACE/cloud-patches/v0.15.202-from-v0.15.175.patch.xz.b64" "$WORK/v202.patch" <<'PY'
          import base64,hashlib,lzma,pathlib,sys
          raw=lzma.decompress(base64.b64decode(pathlib.Path(sys.argv[1]).read_text().strip(),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='0673bcda0ab0105d1dafe826b4a5a7977c0f220ad1c111ef49a5156705040b1f'
          pathlib.Path(sys.argv[2]).write_bytes(raw)
          PY
          git -C "$ROOT" apply --check "$WORK/v202.patch"
          git -C "$ROOT" apply "$WORK/v202.patch"
          grep -q 'versionCode = 352' "$ROOT/app/build.gradle.kts"
          python3 cloud-tools/higi-v203-apply.py "$ROOT"
          python3 cloud-tools/higi-v204-apply.py "$ROOT"
          python3 "$ROOT/tools/sync-release-version.py" --write --root "$ROOT"
          python3 "$ROOT/tools/sync-release-version.py" --check --root "$ROOT"
          grep -q 'versionCode = 354' "$ROOT/app/build.gradle.kts"
          grep -q 'versionName = "0.15.204"' "$ROOT/app/build.gradle.kts"
          python3 - "$ROOT" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])/'app/src/main/java/com/example/hebrewcrossword'
          a=(p/'RecentCrosswordsActivity.kt').read_text()
          b=(p/'CanonicalPuzzleCloud.kt').read_text()
          c=(p/'CanonicalSourceImageStorage.kt').read_text()
          d=(p/'MainActivity.kt').read_text()
          assert '10->confirmSavedDryCanonicalPublication(target)' in a
          assert 'fun replaceCanonicalSourceImageOnly(' in b
          assert 'sourceStatus="תמונה קנונית מאומתת' in d
          assert 'showLocalSourceImage' in d
          assert 'explicitDryAdminPublish=true' in d
          assert 'AdminPuzzleMenu.actions.filter{it.id!=10}' in a
          assert 'explicitDryAdminPublish=true' in a
          assert 'if(BuildConfig.HIGI_DRY_BUILD && (!explicitDryAdminPublish || !allowSourceReplacement' in b
          assert 'if(BuildConfig.HIGI_DRY_BUILD && !explicitDryAdminPublish)' in c
          assert 'DRY local-only; upload and canonical publication blocked' in d
          assert 'canonical-publish-skipped' in d
          assert 'בגרסת DRY השמירה הקנונית חסומה' in b
          print('PASS canonical viewer, image replacement and DRY isolation guards')
          PY
          git -C "$ROOT" add -N -A
          git -C "$ROOT" diff --binary HEAD > "$WORK/v204.patch"
          test -s "$WORK/v204.patch"
          git -C "$ROOT" reset --hard -q HEAD
          git -C "$ROOT" clean -fdq
          git -C "$ROOT" apply --check "$WORK/v204.patch"
          git -C "$ROOT" apply "$WORK/v204.patch"
          python3 "$ROOT/tools/sync-release-version.py" --check --root "$ROOT"
          python3 - "$WORK/v204.patch" "$GITHUB_WORKSPACE" <<'PY'
          import base64,hashlib,json,lzma,pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_bytes()
          base=pathlib.Path(sys.argv[2])
          name='cloud-patches/v0.15.204-from-v0.15.175.patch.xz.b64'
          manifest=base/'cloud-releases/v0.15.204-DRY.json'
          assert not (base/name).exists() and not manifest.exists()
          (base/name).write_text(base64.b64encode(lzma.compress(raw,preset=9)).decode()+'\n')
          cfg={
            'channel':'dry','version':'0.15.204','versionCode':354,
            'patchFile':name,'patchSha256':hashlib.sha256(raw).hexdigest(),
            'notes':'Higi 0.15.204 DRY: server-verified Canonical source image viewer; explicit administrator-only image-only Canonical replacement from puzzle image screen; preserves canonical grid, clue text, answers and user progress; invalidates old image-specific crops and approvals, keeps other DRY isolation; no AI calls. Cloud Gradle regression and original signer gate.'
          }
          manifest.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n')
          print('Prepared v204 patch',cfg['patchSha256'])
          PY
      - name: Commit immutable source patch and trigger gated cloud APK build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name higicrossword
          git config user.email higicrossword@users.noreply.github.com
          git add cloud-patches/v0.15.204-from-v0.15.175.patch.xz.b64 cloud-releases/v0.15.204-DRY.json
          git commit -m 'Stage Higi 0.15.204 DRY canonical image-only replacement'
          git push origin HEAD:main
