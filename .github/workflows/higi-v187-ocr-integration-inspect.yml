name: Higi v187 OCR integration inspect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/higi-v187-ocr-integration-inspect.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned source and inspect crop pipeline
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/higi-read"
          mkdir -p "$BASE"
          curl --silent --show-error --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' \
            -o "$BASE/base.zip" \
            "https://api.github.com/repos/higicrossword/Higi-Releases/releases/assets/720424907"
          echo "ad14647edf7facd1d20309cfd2ae48cca779288ad06488c4d80b2404d8933dd7  $BASE/base.zip" | sha256sum -c --status
          unzip -q "$BASE/base.zip" -d "$BASE/source"
          ROOT="$BASE/source/HebrewCrosswordApp_v0.15.175"
          python - "$GITHUB_WORKSPACE/cloud-patches/v0.15.187-from-v0.15.175.patch.xz.b64" "$BASE/v187.patch" <<'PY'
          import pathlib,base64,lzma,hashlib,sys
          raw=lzma.decompress(base64.b64decode(pathlib.Path(sys.argv[1]).read_text().strip()))
          assert hashlib.sha256(raw).hexdigest()=="199ad749bff027dfe5b429a0686bf0872e853bdf2b642c7c20753badfa02df37"
          pathlib.Path(sys.argv[2]).write_bytes(raw)
          PY
          git -C "$ROOT" apply "$BASE/v187.patch"
          python - "$ROOT" <<'PY'
          import pathlib,sys,re
          root=pathlib.Path(sys.argv[1])
          src=root/'app/src/main/java/com/example/hebrewcrossword'
          pats=('OcrInlineClueRecoveryV180','V180_','inlineResult')
          print('=== PIPELINE REFERENCES ===')
          for p in src.glob('*.kt'):
              content=p.read_text(errors='replace')
              matches=[(i,l) for i,l in enumerate(content.splitlines(),1) if any(s.lower() in l.lower() for s in pats)]
              if matches:
                  print('###',p.name)
                  for i,l in matches[:50]:
                      print(f"{i}: {l[:200]}")
          print('=== RELEVANT EXCERPTS ===')
          for fn in ['HigiLocalOcrCropEngine.kt','OcrSharedRowSplitterV161.kt']:
              p=src/fn
              if not p.exists():continue
              ls=p.read_text().splitlines()
              print('FILE',fn,'LINES',len(ls))
              for i,line in enumerate(ls,1):
                  if any(x.lower() in line.lower() for x in ('InlineClue','preview','fallback','reviewOnly','override','wordBoxes','generate')):
                      print(f"{i}: {line[:220]}")
          print('=== UNIT TESTS OCR ===')
          for p in (root/'app/src/test').rglob('*.kt'):
              if 'ocr' in p.name.lower() or 'inline' in p.name.lower():print(str(p.relative_to(root)))
          PY
