          patch='v0.15.198-from-v0.15.175.patch.xz.b64'
          (dest/patch).write_text(base64.b64encode(lzma.compress(raw,preset=9)).decode()+'\n')
          cfg={'channel':'dry','version':'0.15.198','versionCode':348,
               'patchFile':'cloud-patches/'+patch,
               'patchSha256':hashlib.sha256(raw).hexdigest(),
               'notes':'Higi 0.15.198 DRY: fixed horizontal swipe between OCR clue crops; single shared Yedioth Dekel weekly layout profile (Mon/Wed) with RTL two-boundary review-only proposals; Tartey Mashma and Hafuch unchanged; no Canonical or Firebase writes.'}
          (dest/'v0.15.198-DRY.json').write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n')
          print('V198_PATCH_SHA256',cfg['patchSha256'])
          PY
