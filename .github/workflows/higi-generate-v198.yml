name: Higi v0.15.198 - generate pinned DRY source patch

on:
  push:
    branches: ['higi/yedioth-weekly-ocr-work']
    paths: ['.github/workflows/higi-generate-v198.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: higi-v198-source-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: higicrossword/Higi-Releases
      BASE_SHA: ad14647edf7facd1d20309cfd2ae48cca779288ad06488c4d80b2404d8933dd7
      V197_PATCH_SHA: bd973b2aa48e6e49256d1a1791200ca6b6c2fa5b092d1375d577c02bdc87fdb2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore v197 exactly, apply reviewed WIP, increment only DRY version
        shell: bash
        run: |
          set -euo pipefail
          ! gh release view v0.15.198-DRY --repo "$REPO" --json tagName >/dev/null 2>&1 || { echo 'v198 release already exists'; exit 1; }
          ! gh api "repos/$REPO/contents/cloud-releases/v0.15.198-DRY.json" >/dev/null 2>&1 || { echo 'v198 manifest already exists'; exit 1; }
          mkdir -p "$RUNNER_TEMP/higi198"
          curl --silent --show-error --fail --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/octet-stream' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$RUNNER_TEMP/higi198/base.zip" \
            "https://api.github.com/repos/$REPO/releases/assets/720424907"
          echo "$BASE_SHA  $RUNNER_TEMP/higi198/base.zip" | sha256sum --check --status
          unzip -q "$RUNNER_TEMP/higi198/base.zip" -d "$RUNNER_TEMP/higi198"
          ROOT="$RUNNER_TEMP/higi198/HebrewCrosswordApp_v0.15.175"
          test -f "$ROOT/app/build.gradle.kts"
          echo "HIGI198_ROOT=$ROOT" >> "$GITHUB_ENV"
          git -C "$ROOT" init -q
          git -C "$ROOT" add -A
          git -C "$ROOT" -c user.name=Higi-CI -c user.email=ci@users.noreply.github.com commit -qm baseline-v175
          python3 - "$GITHUB_WORKSPACE/cloud-patches/v0.15.197-from-v0.15.175.patch.xz.b64" "$RUNNER_TEMP/higi198/v197.patch" "$V197_PATCH_SHA" <<'PY'
          import base64,hashlib,lzma,pathlib,sys
          raw=lzma.decompress(base64.b64decode(pathlib.Path(sys.argv[1]).read_text().strip(),validate=True))
          assert hashlib.sha256(raw).hexdigest()==sys.argv[3], 'v197 patch SHA256 mismatch'
          pathlib.Path(sys.argv[2]).write_bytes(raw)
          PY
          git -C "$ROOT" apply --check "$RUNNER_TEMP/higi198/v197.patch"
          git -C "$ROOT" apply "$RUNNER_TEMP/higi198/v197.patch"
          grep -q 'versionCode = 347' "$ROOT/app/build.gradle.kts"
          grep -q 'versionName = "0.15.197"' "$ROOT/app/build.gradle.kts"
          git -C "$ROOT" add -A
          git -C "$ROOT" -c user.name=Higi-CI -c user.email=ci@users.noreply.github.com commit -qm pinned-v197
          python3 "$GITHUB_WORKSPACE/cloud-tools/higi-weekly-swipe-wip-apply.py" \
            "$ROOT" "$GITHUB_WORKSPACE/cloud-tools"
          python3 - "$ROOT/app/build.gradle.kts" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);s=p.read_text()
          for old,new in [('versionCode = 347','versionCode = 348'),
                          ('versionName = "0.15.197"','versionName = "0.15.198"')]:
              assert s.count(old)==1,f'Expected one occurrence: {old}'
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python3 "$ROOT/tools/sync-release-version.py" --write --root "$ROOT"
          python3 "$ROOT/tools/sync-release-version.py" --check --root "$ROOT"
          grep -q 'versionCode = 348' "$ROOT/app/build.gradle.kts"
          grep -q 'versionName = "0.15.198"' "$ROOT/app/build.gradle.kts"
          grep -q 'horizontalPanAvailable' "$ROOT/app/src/main/java/com/example/hebrewcrossword/AdminOcrSelectedCropView.kt"
          grep -q 'AdminOcrSwipeTracker' "$ROOT/app/src/main/java/com/example/hebrewcrossword/AdminClueRegionsActivity.kt"
          grep -q 'YEDIOTH_DEKEL_WEEKLY' "$ROOT/app/src/main/java/com/example/hebrewcrossword/OcrSeriesProfilesV197.kt"
          grep -q 'YEDIOTH_WEEKLY_TWO_BOUNDARY_REVIEW_ONLY' "$ROOT/app/src/main/java/com/example/hebrewcrossword/OcrSeriesPreviewV197.kt"
          test -f "$ROOT/app/src/test/java/com/example/hebrewcrossword/AdminOcrSwipeTrackerTest.kt"
          git -C "$ROOT" add -N -A
          # Version synchronization legitimately updates two local Firebase Hosting
          # metadata files. Permit only these exact files; never deploy backend.
          UNEXPECTED="$(git -C "$ROOT" diff --name-only HEAD |
            grep -E '^firebase/|^cloudflare/|^app/google-services.json
          git -C "$ROOT" diff HEAD~1 --binary > "$RUNNER_TEMP/higi198/v198.patch"
          test -s "$RUNNER_TEMP/higi198/v198.patch"
          git -C "$ROOT" reset --hard -q HEAD~1
          git -C "$ROOT" clean -fdq
          git -C "$ROOT" apply --check "$RUNNER_TEMP/higi198/v198.patch"
          git -C "$ROOT" apply "$RUNNER_TEMP/higi198/v198.patch"
          python3 "$ROOT/tools/sync-release-version.py" --check --root "$ROOT"
          echo "V198_RECONSTRUCTION_OK"
      - name: Run Android Gradle regression tests on exact v198 source
        shell: bash
        run: |
          set -euo pipefail
          cd "$HIGI198_ROOT"
          gradle --no-daemon -PhigiDryBuild=true :app:testDebugUnitTest --console plain
          echo "V198_REGRESSIONS_OK"
      - name: Generate complete and re-applicable baseline patch (no release yet)
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/higi198/v198.patch" "$RUNNER_TEMP/higi198" <<'PY'
          import base64,hashlib,json,lzma,pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_bytes()
          dest=pathlib.Path(sys.argv[2])
          patch='v0.15.198-from-v0.15.175.patch.xz.b64'
          (dest/patch).write_text(base64.b64encode(lzma.compress(raw,preset=9)).decode()+'\n')
          cfg={'channel':'dry','version':'0.15.198','versionCode':348,
               'patchFile':'cloud-patches/'+patch,
               'patchSha256':hashlib.sha256(raw).hexdigest(),
               'notes':'Higi 0.15.198 DRY: fixed horizontal swipe between OCR clue crops; single shared Yedioth Dekel weekly layout profile (Mon/Wed) with RTL two-boundary review-only proposals; Tartey Mashma and Hafuch unchanged; no Canonical or Firebase writes.'}
          (dest/'v0.15.198-DRY.json').write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n')
          print('V198_PATCH_SHA256',cfg['patchSha256'])
          PY
      - name: Publish pinned source patch and manifest to main (cloud builder gates release)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name higicrossword
          git config user.email higicrossword@users.noreply.github.com
          git fetch origin main
          git checkout -B v198-publish origin/main
          test ! -e cloud-patches/v0.15.198-from-v0.15.175.patch.xz.b64
          test ! -e cloud-releases/v0.15.198-DRY.json
          cp "$RUNNER_TEMP/higi198/v0.15.198-from-v0.15.175.patch.xz.b64" cloud-patches/
          cp "$RUNNER_TEMP/higi198/v0.15.198-DRY.json" cloud-releases/
          git add cloud-patches/v0.15.198-from-v0.15.175.patch.xz.b64 cloud-releases/v0.15.198-DRY.json
          git commit -m 'Stage Higi 0.15.198 DRY pinned OCR weekly and swipe fixes'
          git push origin HEAD:main
 |
            grep -Ev '^firebase/public/(app-version.json|update/index.html)
          git -C "$ROOT" diff HEAD~1 --binary > "$RUNNER_TEMP/higi198/v198.patch"
          test -s "$RUNNER_TEMP/higi198/v198.patch"
          git -C "$ROOT" reset --hard -q HEAD~1
          git -C "$ROOT" clean -fdq
          git -C "$ROOT" apply --check "$RUNNER_TEMP/higi198/v198.patch"
          git -C "$ROOT" apply "$RUNNER_TEMP/higi198/v198.patch"
          python3 "$ROOT/tools/sync-release-version.py" --check --root "$ROOT"
          echo "V198_RECONSTRUCTION_OK"
