        shell: bash
        run: |
          set -euo pipefail
          git config user.name higicrossword
          git config user.email higicrossword@users.noreply.github.com
          git fetch origin main
          git checkout -B v198-publish origin/main
          test ! -e cloud-patches/v0.15.198-from-v0.15.175.patch.xz.b64
          test ! -e cloud-releases/v0.15.198-DRY.json
          cp "$RUNNER_TEMP/higi198/v0.15.198-from-v0.15.175.patch.xz.b64" cloud-patches/
          cp "$RUNNER_TEMP/higi198/v0.15.198-DRY.json" cloud-releases/
          git add cloud-patches/v0.15.198-from-v0.15.175.patch.xz.b64 cloud-releases/v0.15.198-DRY.json
          git commit -m 'Stage Higi 0.15.198 DRY pinned OCR weekly and swipe fixes'
          git push origin HEAD:main
 || true)"
          if [ -n "$UNEXPECTED" ]; then
            printf 'FAIL: unexpected backend or Firebase mutation\\n%s\\n' "$UNEXPECTED"
            exit 1
          fi
          git -C "$ROOT" diff HEAD~1 --binary > "$RUNNER_TEMP/higi198/v198.patch"
