name: Higi v187 across OCR diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/higi-v187-across-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct trusted source and print OCR integration points
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/higi-read"
          mkdir -p "$BASE"
          curl --silent --show-error --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/octet-stream' \
            --output "$BASE/base.zip" \
            "https://api.github.com/repos/higicrossword/Higi-Releases/releases/assets/720424907"
          echo "ad14647edf7facd1d20309cfd2ae48cca779288ad06488c4d80b2404d8933dd7  $BASE/base.zip" | sha256sum -c
          unzip -q "$BASE/base.zip" -d "$BASE/source"
          ROOT="$BASE/source/HebrewCrosswordApp_v0.15.175"
          python - "$GITHUB_WORKSPACE/cloud-patches/v0.15.187-from-v0.15.175.patch.xz.b64" "$BASE/v187.patch" <<'PY'
          import pathlib,base64,lzma,hashlib,sys
          b=lzma.decompress(base64.b64decode(pathlib.Path(sys.argv[1]).read_text().strip()))
          assert hashlib.sha256(b).hexdigest()=="199ad749bff027dfe5b429a0686bf0872e853bdf2b642c7c20753badfa02df37"
          pathlib.Path(sys.argv[2]).write_bytes(b)
          PY
          git -C "$ROOT" apply "$BASE/v187.patch"
          python - "$ROOT" <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1])
          folder=root/'app/src/main/java/com/example/hebrewcrossword'
          print("==== OCR CODE FILES ====")
          for p in folder.glob('*Ocr*'): print(p.name)
          p=folder/'OcrInlineClueRecoveryV180.kt'
          ls=p.read_text().splitlines()
          print("==== OcrInlineClueRecoveryV180.kt total lines ",len(ls)," ====")
          for i,line in enumerate(ls,1):
              if i<=540: print(f"v180:{i}: {line}")
          PY
