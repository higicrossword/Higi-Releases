name: Higi v194 targeted OCR pipeline diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/higi-v194-ocr-inspect.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_SHA: ad14647edf7facd1d20309cfd2ae48cca779288ad06488c4d80b2404d8933dd7
      PATCH_SHA: 01921669193914c9d242ccfb96822edb3de3b803f3230085c8ed971be091d64e
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ocrinspect"
          curl --silent --show-error --fail --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/octet-stream' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$RUNNER_TEMP/ocrinspect/base.zip" \
            "https://api.github.com/repos/higicrossword/Higi-Releases/releases/assets/720424907"
          echo "$BASE_SHA  $RUNNER_TEMP/ocrinspect/base.zip" | sha256sum --check --status
          unzip -q "$RUNNER_TEMP/ocrinspect/base.zip" -d "$RUNNER_TEMP/ocrinspect/source"
          ROOT="$RUNNER_TEMP/ocrinspect/source/HebrewCrosswordApp_v0.15.175"
          git -C "$ROOT" init -q
          git -C "$ROOT" add -A
          git -C "$ROOT" -c user.name='Build' -c user.email='build@example.invalid' commit -qm baseline
          python - "$GITHUB_WORKSPACE/cloud-patches/v0.15.194-from-v0.15.175.patch.xz.b64" "$RUNNER_TEMP/ocrinspect/patch" "$PATCH_SHA" <<'PY'
          import base64,lzma,hashlib,pathlib,sys
          data=lzma.decompress(base64.b64decode(pathlib.Path(sys.argv[1]).read_text().strip(),validate=True))
          assert hashlib.sha256(data).hexdigest()==sys.argv[3]
          pathlib.Path(sys.argv[2]).write_bytes(data)
          PY
          git -C "$ROOT" apply --check "$RUNNER_TEMP/ocrinspect/patch"
          git -C "$ROOT" apply "$RUNNER_TEMP/ocrinspect/patch"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
      - name: Diagnose review stage gating and data wiring (no image/OCR upload)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,pathlib,re
          root=pathlib.Path(os.environ['ROOT'])
          src=root/'app/src/main/java/com/example/hebrewcrossword'
          engine=(src/'HigiLocalOcrCropEngine.kt').read_text()
          print('SOURCE_CHECKS')
          for token in ['OcrPrintedLineRecoveryV178.recover','OcrSemicolonBoundaryV194.inspect',
              'newPreviews[k]=proposal','newPreviewReasons[k]=v194.diagnostics[label].orEmpty()',
              'if(refineSharedRows && auditWords.isNotEmpty())']:
              print(repr(token),':',engine.count(token))
          for token in ['val expectedWires=', 'val auditWords=', 'val newPreviews=', 'val v194=', 'OcrSemicolonBoundaryV194.inspect']:
              i=engine.find(token); print('GATING',token,'offset',i)
              if i>=0:print(' '.join(engine[max(0,i-180):i+250].split()))
          print('UI_REFERENCES')
          kotlin=list(src.glob('*.kt'))
          for p in kotlin:
              if p.name=='HigiLocalOcrCropEngine.kt':continue
              s=p.read_text(errors='replace')
              if ('newPreviewReasons' in s or 'previewReasons' in s or
                  ('refineSharedRows' in s and 'HigiLocalOcrCropEngine' in s)):
                  lines=s.splitlines()
                  print('FILE',p.name)
                  for i,line in enumerate(lines):
                      if any(tok in line for tok in ['previewReasons', 'newPreviewReasons',
                          'refineSharedRows=', 'refineSharedRows =','localPreview']):
                          print(str(i+1)+': '+line[:210].strip())
          for name,patterns in [('HigiLocalOcrCropEngine.kt',['val accepted=', 'accepted.remove(', 'val v194=', 'v194.previews.forEach','v194.diagnostics.forEach']),('AdminOcrRecropActivity.kt',['private fun','previewOnly.putAll','candidateMode','result?.previewOnly','localOcr','previewReasons.putAll'])]:
              data=(src/name).read_text().splitlines()
              print('DETAILS',name)
              matched=[i for i,line in enumerate(data) if any(p in line for p in patterns)]
              selected=set()
              for i in matched:
                  for j in range(max(0,i-5),min(len(data),i+15)):selected.add(j)
              for i in sorted(selected):print(str(i+1)+': '+data[i][:200])
          print('INSPECT_COMPLETE')
          PY
