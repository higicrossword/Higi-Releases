name: Higi v203 Canonical Publisher Source Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/higi-v203-source-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct pinned v202 source and inspect publication paths only
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/higi-v203-audit"
          mkdir -p "$WORK"
          curl --silent --show-error --fail --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$WORK/source.zip" \
            "https://api.github.com/repos/higicrossword/Higi-Releases/releases/assets/720424907"
          echo "ad14647edf7facd1d20309cfd2ae48cca779288ad06488c4d80b2404d8933dd7  $WORK/source.zip" | sha256sum --check --status
          unzip -q "$WORK/source.zip" -d "$WORK/source"
          ROOT="$WORK/source/HebrewCrosswordApp_v0.15.175"
          python3 - "$GITHUB_WORKSPACE/cloud-patches/v0.15.202-from-v0.15.175.patch.xz.b64" "$WORK/v202.patch" <<'PY'
          import base64,hashlib,lzma,pathlib,sys
          raw=lzma.decompress(base64.b64decode(pathlib.Path(sys.argv[1]).read_text().strip(),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='0673bcda0ab0105d1dafe826b4a5a7977c0f220ad1c111ef49a5156705040b1f'
          pathlib.Path(sys.argv[2]).write_bytes(raw)
          PY
          git -C "$ROOT" apply --check "$WORK/v202.patch"
          git -C "$ROOT" apply "$WORK/v202.patch"
          python3 - "$ROOT" <<'PY'
          from pathlib import Path
          import sys,re
          root=Path(sys.argv[1])/'app/src/main/java/com/example/hebrewcrossword'
          names=['AdminPuzzleMenu.kt','RecentCrosswordsActivity.kt','CanonicalPuzzleCloud.kt','MainActivity.kt']
          extras=[p for p in root.glob('*.kt') if 'Source' in p.name and ('Cloud' in p.name or 'Storage' in p.name)]
          pats={
            'AdminPuzzleMenu.kt':['object AdminPuzzleMenu'],
            'RecentCrosswordsActivity.kt':['private fun executeSavedAdminAction','private fun runAdminMenuAction','private fun resolveSavedAdminTarget','data class SavedAdminTarget'],
            'CanonicalPuzzleCloud.kt':['fun refreshDecodedForAdmin','fun publishIfAbsent','fun updateDecodedForAdminAtNode','BuildConfig.HIGI_DRY_BUILD'],
            'MainActivity.kt':['CANONICAL_SOURCE_UPLOAD','fun recoverLocalReviewCanonical','fun publishCanonicalIfComplete','refreshDecodedForAdmin','uploadSource','uploadImage'],
          }
          for name in names+sorted(set(p.name for p in extras)-set(names)):
            p=root/name
            if not p.exists():continue
            lines=p.read_text().splitlines()
            print(f"==== FILE {name} total={len(lines)} ====")
            if name=='AdminPuzzleMenu.kt':
              for i,line in enumerate(lines):print(f"{i+1:05d} {line}")
              continue
            hits=[i for i,line in enumerate(lines) if any(x in line for x in pats.get(name,['upload','Storage','firebase']))]
            ranges=[]
            for h in hits[:16]:
              a=max(0,h-(12 if name=='MainActivity.kt' else 5))
              b=min(len(lines),h+(25 if name=='MainActivity.kt' else 33))
              if ranges and a<=ranges[-1][1]:ranges[-1]=(ranges[-1][0],max(b,ranges[-1][1]))
              else:ranges.append((a,b))
            total=0
            for a,b in ranges:
              print(f"--- {a+1}-{b} ---")
              for i in range(a,b):
                print(f"{i+1:05d} {lines[i]}")
                total+=1
                if total>360:break
              if total>360:break
          PY
