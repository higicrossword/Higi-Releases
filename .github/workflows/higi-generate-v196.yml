name: Higi 0.15.196 - safe admin OCR review patch generator

on:
  push:
    branches: [main]
    paths: ['.github/workflows/higi-generate-v196.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: higi-v196-patch-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: higicrossword/Higi-Releases
      BASE_SHA: ad14647edf7facd1d20309cfd2ae48cca779288ad06488c4d80b2404d8933dd7
      PREV_PATCH_SHA: 93f367897b46f44a674f722739d23e3d0c683dbcf8f449a098aed59e8ab5819e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore exact v195 source from pinned baseline
        shell: bash
        run: |
          set -euo pipefail
          ! gh release view v0.15.196-DRY --repo "$REPO" --json tagName >/dev/null 2>&1 || { echo 'v196 release already exists'; exit 1; }
          mkdir -p "$RUNNER_TEMP/higi196/source"
          curl --silent --show-error --fail --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/octet-stream' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$RUNNER_TEMP/higi196/base.zip" \
            "https://api.github.com/repos/$REPO/releases/assets/720424907"
          echo "$BASE_SHA  $RUNNER_TEMP/higi196/base.zip" | sha256sum --check --status
          unzip -q "$RUNNER_TEMP/higi196/base.zip" -d "$RUNNER_TEMP/higi196/source"
          ROOT="$RUNNER_TEMP/higi196/source/HebrewCrosswordApp_v0.15.175"
          test -f "$ROOT/app/build.gradle.kts"
          git -C "$ROOT" init -q
          git -C "$ROOT" add -A
          git -C "$ROOT" -c user.name='Higi build' -c user.email='higi-build@users.noreply.github.com' commit -qm 'pinned 175'
          python - "$GITHUB_WORKSPACE/cloud-patches/v0.15.195-from-v0.15.175.patch.xz.b64" "$RUNNER_TEMP/higi196/v195.patch" "$PREV_PATCH_SHA" <<'PY'
          import base64,lzma,hashlib,pathlib,sys
          raw=lzma.decompress(base64.b64decode(pathlib.Path(sys.argv[1]).read_text().strip(),validate=True))
          assert hashlib.sha256(raw).hexdigest()==sys.argv[3], 'v195 patch mismatch'
          pathlib.Path(sys.argv[2]).write_bytes(raw)
          PY
          git -C "$ROOT" apply --check "$RUNNER_TEMP/higi196/v195.patch"
          git -C "$ROOT" apply "$RUNNER_TEMP/higi196/v195.patch"
          grep -q 'versionCode = 345' "$ROOT/app/build.gradle.kts"
          grep -q 'versionName = "0.15.195"' "$ROOT/app/build.gradle.kts"
          python "$GITHUB_WORKSPACE/cloud-tools/higi-v196-apply.py" "$ROOT"
          python "$ROOT/tools/sync-release-version.py" --write --root "$ROOT"
          python "$ROOT/tools/sync-release-version.py" --check --root "$ROOT"
          grep -q 'versionCode = 346' "$ROOT/app/build.gradle.kts"
          grep -q 'versionName = "0.15.196"' "$ROOT/app/build.gradle.kts"
          grep -q 'OcrLegacyReviewBridgeV196.inspect' "$ROOT/app/src/main/java/com/example/hebrewcrossword/HigiLocalOcrCropEngine.kt"
          grep -q 'OcrClueCompletenessV196.review' "$ROOT/app/src/main/java/com/example/hebrewcrossword/HigiLocalOcrCropEngine.kt"
          test -f "$ROOT/app/src/test/java/com/example/hebrewcrossword/OcrReviewSafetyV196Test.kt"
          git -C "$ROOT" add -N -A
          git -C "$ROOT" diff HEAD --binary > "$RUNNER_TEMP/higi196/v196.patch"
          test -s "$RUNNER_TEMP/higi196/v196.patch"
          git -C "$ROOT" reset --hard -q HEAD
          git -C "$ROOT" clean -fdq
          git -C "$ROOT" apply --check "$RUNNER_TEMP/higi196/v196.patch"
          git -C "$ROOT" apply "$RUNNER_TEMP/higi196/v196.patch"
          python "$ROOT/tools/sync-release-version.py" --check --root "$ROOT"
          python - "$RUNNER_TEMP/higi196/v196.patch" "$GITHUB_WORKSPACE" <<'PY'
          import base64,hashlib,json,lzma,pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_bytes()
          root=pathlib.Path(sys.argv[2])
          name='cloud-patches/v0.15.196-from-v0.15.175.patch.xz.b64'
          assert not (root/name).exists(), 'Do not overwrite existing v196 patch'
          (root/name).write_text(base64.b64encode(lzma.compress(raw,preset=9)).decode()+'\n')
          cfg={'channel':'dry','version':'0.15.196','versionCode':346,'patchFile':name,
               'patchSha256':hashlib.sha256(raw).hexdigest(),
               'notes':'Administrator-only source-number review bridge and completeness gating; preserve canonical and manual crops'}
          manifest=root/'cloud-releases/v0.15.196-DRY.json'
          assert not manifest.exists(), 'Do not overwrite existing v196 manifest'
          manifest.write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n')
          print('v196 patch SHA256:',cfg['patchSha256'])
          PY
      - name: Commit verified patch and release manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name higicrossword
          git config user.email higicrossword@users.noreply.github.com
          git add cloud-patches/v0.15.196-from-v0.15.175.patch.xz.b64 cloud-releases/v0.15.196-DRY.json
          git commit -m 'Stage Higi v0.15.196 DRY pinned source and OCR regression gates'
          git push origin HEAD:main
