name: Higi v214 WIP admin evidence source compile and regression (NO RELEASE)
on:
  push:
    branches: ['qa/v0.15.214-word-length-evidence']
    paths:
      - '.github/workflows/higi-v214-admin-evidence-wip.yml'
      - 'cloud-tests/v214-length-evidence/**'
  workflow_dispatch:
permissions:
  contents: write # needed for authenticated private draft source asset; this workflow has no writes
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: higicrossword/Higi-Releases
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Read and verify exact sealed source and source overlays
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $info=(& gh api "repos/$env:REPO/releases/437513599" | Out-String | ConvertFrom-Json)
          if(!$info.draft -or $info.tag_name -ne 'v0.15.175'){throw 'Private source draft mismatch'}
          $asset=@($info.assets|Where-Object {$_.name -eq 'HebrewCrosswordApp_v0.15.175_SOURCE.zip'})
          if($asset.Count -ne 1){throw 'Missing immutable source asset'}
          $z=Join-Path $env:RUNNER_TEMP 'sealed-v175.zip'
          & curl.exe --fail --silent --show-error --location --retry 3 --header "Authorization: Bearer $env:GH_TOKEN" --header "Accept: application/octet-stream" --header "X-GitHub-Api-Version: 2022-11-28" --output $z "https://api.github.com/repos/$env:REPO/releases/assets/$($asset[0].id)"
          if($LASTEXITCODE -ne 0){throw 'Cannot download sealed source'}
          if((Get-FileHash $z -Algorithm SHA256).Hash -ne 'AD14647EDF7FACD1D20309CFD2AE48CCA779288AD06488C4D80B2404D8933DD7'){throw 'Source hash mismatch'}
          if((Get-Item $z).Length -ne [long]$asset[0].size){throw 'Source size mismatch'}
          $location=Join-Path $env:RUNNER_TEMP 'HigiV214'
          Expand-Archive $z -DestinationPath $location -Force
          $src=Join-Path $location 'HebrewCrosswordApp_v0.15.175'
          if(!(Test-Path (Join-Path $src 'app/build.gradle.kts'))){throw 'Wrong source root'}
          Add-Content $env:GITHUB_ENV "HIGI_SOURCE_ROOT=$src"
          & git -C $src init -q
          & git -C $src add -A
          & git -C $src -c user.name=QA -c user.email=qa@localhost commit -qm exact175
          $py=@'
          import base64,hashlib,json,lzma,pathlib,sys
          repo=pathlib.Path(sys.argv[1]); dest=pathlib.Path(sys.argv[2])
          manifest=json.loads((repo/'cloud-releases/v0.15.213-DRY.json').read_text())
          assert manifest['version']=='0.15.213' and manifest['versionCode']==363
          def decode(path):
              return lzma.decompress(base64.b64decode(''.join(path.read_text().split()),validate=True))
          baseline=decode(repo/manifest['patchFile'])
          assert hashlib.sha256(baseline).hexdigest()=='62875d7237d46b19eb877512b28268be5ff970aca04fd8e7a95faeb640390328'
          (dest/'pinned-v213.patch').write_bytes(baseline)
          overlay=decode(repo/'cloud-tests/v214-length-evidence/overlay.patch.xz.b64')
          assert hashlib.sha256(overlay).hexdigest()=='cbc7fb2b987673807e82142097d342c756db8c3de503ea038659fce9bcb2ae55'
          (dest/'reviewed-v214.patch').write_bytes(overlay)
          print('V214_PATCH_SHA256_VERIFIED')
          '@
          $decoder=Join-Path $env:RUNNER_TEMP 'decode-qa.py'
          [IO.File]::WriteAllText($decoder,$py)
          & python $decoder $env:GITHUB_WORKSPACE $env:RUNNER_TEMP
          if($LASTEXITCODE -ne 0){throw 'Patch verification failed'}
          $p=Join-Path $env:RUNNER_TEMP 'pinned-v213.patch'
          & git -C $src apply --check $p
          if($LASTEXITCODE -ne 0){throw 'Cannot reconstruct v213'}
          & git -C $src apply $p
          if($LASTEXITCODE -ne 0){throw 'Cannot apply v213'}
          & git -C $src add -A
          & git -C $src -c user.name=QA -c user.email=qa@localhost commit -qm exact213
          $q=Join-Path $env:RUNNER_TEMP 'reviewed-v214.patch'
          & git -C $src apply --check $q
          if($LASTEXITCODE -ne 0){throw 'WIP evidence overlay does not match pinned v213'}
          & git -C $src apply $q
          if($LASTEXITCODE -ne 0){throw 'WIP evidence overlay apply failed'}
          & git -C $src add -N .
          $changed=@(& git -C $src diff --name-only)
          $allowed=@(
            'app/src/main/java/com/example/hebrewcrossword/AdminAiPromptDiagnostic.kt',
            'app/src/main/java/com/example/hebrewcrossword/AdminAiWordLengthsDialog.kt',
            'app/src/main/java/com/example/hebrewcrossword/AdminLengthEvidenceV214.kt',
            'tools/tests/AdminLengthEvidenceV214Test.kt'
          )
          if($changed.Count -ne 4 -or @($changed|Where-Object{$_ -notin $allowed}).Count -ne 0){throw "WIP scope violation"}
          $build=Get-Content -Raw (Join-Path $src 'app/build.gradle.kts')
          if($build -notmatch 'versionCode\s*=\s*363' -or $build -notmatch 'versionName\s*=\s*"0.15.213"'){throw 'Released baseline version changed'}
          Write-Host 'V214_ADMIN_ONLY_FOUR_FILES_MATCH_PINNED_V213'
      - name: Android Kotlin compile and JVM regression (no publication)
        shell: pwsh
        run: |
          Set-Location $env:HIGI_SOURCE_ROOT
          & gradle --no-daemon -PhigiDryBuild=true testDebugUnitTest assembleDebug
          if($LASTEXITCODE -ne 0){throw 'Android compilation or unit tests failed'}
          Write-Host 'V214_WIP_ANDROID_TESTS_COMPILE_PASS_NO_RELEASE'
