name: Higi v196 OCR activity read-only source inspection
on:
  push:
    branches: [main]
    paths: ['.github/workflows/higi-v197-source-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: higicrossword/Higi-Releases
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct exact v196 and inspect source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ins196"
          curl --silent --show-error --fail --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/octet-stream' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$RUNNER_TEMP/ins196/base.zip" \
            "https://api.github.com/repos/$REPO/releases/assets/720424907"
          echo "ad14647edf7facd1d20309cfd2ae48cca779288ad06488c4d80b2404d8933dd7  $RUNNER_TEMP/ins196/base.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/ins196/base.zip" -d "$RUNNER_TEMP/ins196"
          ROOT="$RUNNER_TEMP/ins196/HebrewCrosswordApp_v0.15.175"
          git -C "$ROOT" init -q
          git -C "$ROOT" add -A
          git -C "$ROOT" -c user.name=CI -c user.email=ci@example.invalid commit -qm baseline
          python - "$GITHUB_WORKSPACE/cloud-patches/v0.15.196-from-v0.15.175.patch.xz.b64" "$RUNNER_TEMP/ins196/v196.patch" <<'PY'
          import base64,hashlib,lzma,pathlib,sys
          raw=lzma.decompress(base64.b64decode(pathlib.Path(sys.argv[1]).read_text().strip(),validate=True))
          assert hashlib.sha256(raw).hexdigest()=="8aadda20fe58a341100d0ff7aeb825466e64b3e6c08f75a0f2ace99d8d24a445"
          pathlib.Path(sys.argv[2]).write_bytes(raw)
          PY
          git -C "$ROOT" apply --check "$RUNNER_TEMP/ins196/v196.patch"
          git -C "$ROOT" apply "$RUNNER_TEMP/ins196/v196.patch"
          FILE="$ROOT/app/src/main/java/com/example/hebrewcrossword/AdminOcrRecropActivity.kt"
          echo "=== SOURCE_ACTIVITY_HEAD ==="
          sed -n '1,218p' "$FILE"
          echo "=== SOURCE_ACTIVITY_MIDDLE ==="
          sed -n '285,403p' "$FILE"
          echo "=== SOURCE_ACTIVITY_END ==="
          sed -n '588,750p' "$FILE"
          echo "=== FILE DIFF LIST FROM V175 ==="
          git -C "$ROOT" diff --stat HEAD -- app/src/main/java/com/example/hebrewcrossword/AdminOcrRecropActivity.kt app/src/main/java/com/example/hebrewcrossword/AdminOcrSelectedCropView.kt app/src/main/java/com/example/hebrewcrossword/LocalOcrCropPass.kt
