name: Higi v201 source audit (no version change)
on:
  push:
    branches: ['higi/v201-final-geometry-review']
    paths: ['.github/workflows/higi-v201-source-audit.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact 0.15.200 source and inspect final review path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v201-audit"
          curl --silent --show-error --fail --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/octet-stream' \
            --output "$RUNNER_TEMP/v201-audit/base.zip" \
            "https://api.github.com/repos/higicrossword/Higi-Releases/releases/assets/720424907"
          echo "ad14647edf7facd1d20309cfd2ae48cca779288ad06488c4d80b2404d8933dd7  $RUNNER_TEMP/v201-audit/base.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/v201-audit/base.zip" -d "$RUNNER_TEMP/v201-audit"
          ROOT="$RUNNER_TEMP/v201-audit/HebrewCrosswordApp_v0.15.175"
          python3 - "$GITHUB_WORKSPACE/cloud-patches/v0.15.200-from-v0.15.175.patch.xz.b64" "$RUNNER_TEMP/v201-audit/v200.patch" <<'PY'
          import base64,hashlib,lzma,pathlib,sys
          raw=lzma.decompress(base64.b64decode(pathlib.Path(sys.argv[1]).read_text().strip(),validate=True))
          assert hashlib.sha256(raw).hexdigest()=="f67ed9f57b018af6eb8aab8aa4fa22b52223f2e02d56633eb945bcfbd4d53d92"
          pathlib.Path(sys.argv[2]).write_bytes(raw)
          PY
          git -C "$ROOT" apply --check "$RUNNER_TEMP/v201-audit/v200.patch"
          git -C "$ROOT" apply "$RUNNER_TEMP/v201-audit/v200.patch"
          BASE="$ROOT/app/src/main/java/com/example/hebrewcrossword"
          echo '====== V200 LocalOcrCropPass.kt ======'
          nl -ba "$BASE/LocalOcrCropPass.kt" | sed -n '1,290p'
          echo '====== V200 AdminOcrRecropActivity.kt key regions ======'
          grep -n -C 8 'V200_CROSS_CLUE\|hasV200WeeklyOverlapWarning\|candidates.clear()\|reasons.clear()\|saveButton.isEnabled\|approveButton.isEnabled\|toggleApproval' "$BASE/AdminOcrRecropActivity.kt" | head -230
          echo '====== V200 HigiLocalOcrCropEngine geometry / warnings ======'
          grep -n -C 6 'val allCandidates\|val warnings=OcrWeeklyOverlap\|acceptedPixels()\|newPreviews\|gridPoints\|return Outcome' "$BASE/HigiLocalOcrCropEngine.kt" | tail -340
          echo 'V200_SOURCE_AUDIT_OK'
