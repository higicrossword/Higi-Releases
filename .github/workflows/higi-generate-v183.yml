name: Higi 0.15.183 - pinned source patch generator
on:
  push:
    branches: [main]
    paths: ['.github/workflows/higi-generate-v183.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: higi-v183-patch-generation
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: higicrossword/Higi-Releases
      BASE_SHA: ad14647edf7facd1d20309cfd2ae48cca779288ad06488c4d80b2404d8933dd7
      PATCH_SHA: d273aed4003d04bf809e3e02e28bc836ecdd76cd084472875860cf8801a5d64c
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and retrieve pinned draft source
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/437513599" |
            jq -e '.draft==true and .tag_name=="v0.15.175" and ([.assets[] |
              select(.id==720424907 and .name=="HebrewCrosswordApp_v0.15.175_SOURCE.zip")] | length)==1'
          mkdir -p "$RUNNER_TEMP/higi-v183"
          curl --silent --show-error --fail --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/octet-stream' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$RUNNER_TEMP/higi-v183/base.zip" \
            "https://api.github.com/repos/$REPO/releases/assets/720424907"
          echo "$BASE_SHA  $RUNNER_TEMP/higi-v183/base.zip" | sha256sum --check --status
      - name: Reconstruct v182 and prepare exact v183 source patch
        shell: bash
        run: |
          set -euo pipefail
          BASE="$RUNNER_TEMP/higi-v183"
          unzip -q "$BASE/base.zip" -d "$BASE/source"
          ROOT="$BASE/source/HebrewCrosswordApp_v0.15.175"
          test -f "$ROOT/app/build.gradle.kts"
          git -C "$ROOT" init -q
          git -C "$ROOT" add -A
          git -C "$ROOT" -c user.name='Higi build' \
            -c user.email='higi-build@users.noreply.github.com' commit -qm 'pinned v175'
          python - "$GITHUB_WORKSPACE/cloud-patches/v0.15.182-from-v0.15.175.patch.xz.b64" "$BASE/182.patch" "$PATCH_SHA" <<'PY'
          import base64,hashlib,lzma,pathlib,sys
          raw=lzma.decompress(base64.b64decode(pathlib.Path(sys.argv[1]).read_text().strip(),validate=True))
          assert hashlib.sha256(raw).hexdigest()==sys.argv[3],"v182 patch mismatch"
          pathlib.Path(sys.argv[2]).write_bytes(raw)
          PY
          git -C "$ROOT" apply --check "$BASE/182.patch"
          git -C "$ROOT" apply "$BASE/182.patch"
          python - "$GITHUB_WORKSPACE/cloud-patches/v0.15.183-from-v0.15.182.patch.xz.b64" "$BASE/183-delta.patch" <<'PY'
          import base64,hashlib,lzma,pathlib,sys
          raw=lzma.decompress(base64.b64decode(pathlib.Path(sys.argv[1]).read_text().strip(),validate=True))
          assert hashlib.sha256(raw).hexdigest()=="4f51b683e527288ce7613b1884c98089eb022f1afafaca0141b030c3ea28e66e","v183 delta SHA mismatch"
          pathlib.Path(sys.argv[2]).write_bytes(raw)
          PY
          # V182's local QA-only test file is not in the pinned cloud
          # source; do not require or patch it. The new V183 test is included.
          git -C "$ROOT" apply --check --exclude='app/src/test/java/com/example/hebrewcrossword/OcrInlineHeadingAndSequenceV182Test.kt' "$BASE/183-delta.patch"
          git -C "$ROOT" apply --exclude='app/src/test/java/com/example/hebrewcrossword/OcrInlineHeadingAndSequenceV182Test.kt' "$BASE/183-delta.patch"
          python "$ROOT/tools/sync-release-version.py" --check --root "$ROOT"
          grep -q 'versionCode = 333' "$ROOT/app/build.gradle.kts"
          grep -q 'versionName = "0.15.183"' "$ROOT/app/build.gradle.kts"
          git -C "$ROOT" add -N -A
          git -C "$ROOT" diff HEAD --binary > "$BASE/183.patch"
          test -s "$BASE/183.patch"
          git -C "$ROOT" reset --hard -q HEAD
          git -C "$ROOT" clean -fdq
          git -C "$ROOT" apply --check "$BASE/183.patch"
          git -C "$ROOT" apply "$BASE/183.patch"
          python "$ROOT/tools/sync-release-version.py" --check --root "$ROOT"
          python - "$BASE/183.patch" "$GITHUB_WORKSPACE" <<'PY'
          import base64,hashlib,json,lzma,pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_bytes()
          root=pathlib.Path(sys.argv[2])
          name='cloud-patches/v0.15.183-from-v0.15.175.patch.xz.b64'
          (root/name).write_text(base64.b64encode(lzma.compress(raw,preset=9)).decode()+'\n')
          cfg={'channel':'dry','version':'0.15.183','versionCode':333,'patchFile':name,
               'patchSha256':hashlib.sha256(raw).hexdigest()}
          (root/'cloud-releases/v0.15.183-DRY.json').write_text(json.dumps(cfg,indent=2)+'\n')
          print('v183 full patch SHA256:',cfg['patchSha256'])
          PY
      - name: Commit only compressed patch and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name higicrossword
          git config user.email higicrossword@users.noreply.github.com
          git add cloud-patches/v0.15.183-from-v0.15.175.patch.xz.b64 cloud-releases/v0.15.183-DRY.json
          git commit -m 'Build Higi 0.15.183 DRY from pinned source and OCR fixes'
          git push origin HEAD:main
