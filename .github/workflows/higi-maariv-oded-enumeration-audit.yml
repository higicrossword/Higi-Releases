name: Higi Maariv Oded Rosen clue enumeration audit (read-only)
on:
  push:
    branches: [analysis/maariv-oded-enumeration-20261121]
    paths: ['.github/workflows/higi-maariv-oded-enumeration-audit.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct signed-release source v0.15.212 without publishing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/higi-inspect
          curl --silent --show-error --fail --location --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o /tmp/higi-inspect/base.zip \
            "https://api.github.com/repos/higicrossword/Higi-Releases/releases/assets/720424907"
          echo 'ad14647edf7facd1d20309cfd2ae48cca779288ad06488c4d80b2404d8933dd7  /tmp/higi-inspect/base.zip' | sha256sum -c -
          unzip -q /tmp/higi-inspect/base.zip -d /tmp/higi-inspect
          ROOT=/tmp/higi-inspect/HebrewCrosswordApp_v0.15.175
          python3 - <<'PY'
          import base64,lzma,hashlib,json,pathlib
          cfg=json.loads(pathlib.Path('cloud-releases/v0.15.212-DRY.json').read_text())
          patch=lzma.decompress(base64.b64decode(''.join(pathlib.Path(cfg['patchFile']).read_text().split()),validate=True))
          assert hashlib.sha256(patch).hexdigest()==cfg['patchSha256']
          pathlib.Path('/tmp/higi-inspect/v212.patch').write_bytes(patch)
          PY
          cd "$ROOT"
          git init -q
          git add -A
          git -c user.name=Audit -c user.email=audit@localhost commit -qm baseline
          git apply /tmp/higi-inspect/v212.patch
          echo SOURCE_V212_VERIFIED
      - name: Locate length transformations and clue text edit pipeline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/higi-inspect/HebrewCrosswordApp_v0.15.175/app/src/main/java/com/example/hebrewcrossword')
          arr=list(p.rglob('*.kt'))
          terms=[r'הפוך סדר אורכי',r'אורכי המילים',r'(?i)enumeration',r'(?i)wordLengths',r'(?i)lengths?',r'(?i)clue.*edit',r'(?i)edit.*clue',r'(?i)clue.*text',r'(?i)split.*word',r'(?i)space.*answer',r'(?i)answer.*pattern']
          sig=[x for x in arr if re.search('|'.join(terms),x.read_text(),re.I)]
          print('KOTLIN_FILES',len(arr),'MATCH_FILES',len(sig))
          for f in sig:
              lines=f.read_text().splitlines()
              hits=[i for i,l in enumerate(lines) if re.search('|'.join(terms),l,re.I)]
              print('###',f.name,len(lines),'HITS',len(hits))
              for i in hits[:38]:
                  print(f'{i+1:05d} {lines[i][:260]}')
          print('### KEY EXACT PHRASE CONTEXT')
          for f in arr:
              lines=f.read_text().splitlines()
              for i,l in enumerate(lines):
                  if 'הפוך סדר אורכי' in l or 'אורכי המילים' in l:
                      print('FILE',f.name,'LOC',i+1)
                      for j in range(max(0,i-60),min(len(lines),i+70)):
                          print(f'{j+1:05d} {lines[j][:300]}')
          PY
      - name: Inspect parser and enumeration rewriting rules
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/higi-inspect/HebrewCrosswordApp_v0.15.175/app/src/main/java/com/example/hebrewcrossword')
          terms=[r'\(\d+[ ,]+\d+\)',r'lengthPattern',r'answerLengths',r'wordLen',r'enumeration',r'clueLength',r'parseLength',r'answerLength',r'wordLengths',r'reverseLengths',r'lengthsOrder',r'convert.*length',r'clueText\s*=',r'clue\.text\s*=']
          for f in p.rglob('*.kt'):
              lines=f.read_text().splitlines()
              hits=[i for i,l in enumerate(lines) if any(re.search(t,l,re.I) for t in terms)]
              if not hits:continue
              print('### FILE',f.name,'hits',len(hits))
              ranges=[]
              for i in hits[:14]:
                  a=max(0,i-8); b=min(len(lines),i+15)
                  if ranges and a<=ranges[-1][1]:ranges[-1]=(ranges[-1][0],max(ranges[-1][1],b))
                  else:ranges.append((a,b))
              for a,b in ranges[:5]:
                  for j in range(a,b):print(f'{j+1:05d} {lines[j][:240]}')
          PY
