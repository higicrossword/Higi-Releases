name: Higi Hafuch 20-source bottom ink pixel audit WIP
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/higi-hafuch-bottom-ink-source-audit-wip.yml'
      - 'cloud-tests/hafuch-ocr-crops-wip/audit_bottom_ink_20.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: higicrossword/Higi-Releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image-array dependencies for source-pixel gate
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow numpy
          python3 -m py_compile cloud-tests/hafuch-ocr-crops-wip/audit_bottom_ink_20.py
          python3 cloud-tests/hafuch-ocr-crops-wip/audit_bottom_ink_20.py --self-test
      - name: Read SHA-pinned original JPEGs and real grid bounds (no app build)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original" "$RUNNER_TEMP/grid"
          gh run download 43939011519 --repo "$REPO" \
            --name higi-hafuch-20-original-images-grid-audit --dir "$RUNNER_TEMP/original"
          gh run download 44047765517 --repo "$REPO" \
            --name higi-hafuch-twenty-roi-ocr-word-geometry-wip --dir "$RUNNER_TEMP/grid"
          (cd "$RUNNER_TEMP/original/hafuch-20-source-results" && zip -qr "$RUNNER_TEMP/20-originals.zip" images)
          (cd "$RUNNER_TEMP/grid" && zip -qr "$RUNNER_TEMP/old-grid.zip" hafuch-roi-20)
          python3 - "$RUNNER_TEMP/20-originals.zip" <<'PY'
          import zipfile,sys
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert len([x for x in z.namelist() if x.endswith('.jpg')])==20
          PY
      - name: Check exactly two clipped final clue ink bands
        run: |
          set -euo pipefail
          mkdir -p hafuch-bottom-ink-report
          python3 cloud-tests/hafuch-ocr-crops-wip/audit_bottom_ink_20.py \
            "$RUNNER_TEMP/20-originals.zip" "$RUNNER_TEMP/old-grid.zip" \
            hafuch-bottom-ink-report/pixel-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: higi-hafuch-source-only-bottom-ink
          path: hafuch-bottom-ink-report/
          retention-days: 14
          if-no-files-found: warn
