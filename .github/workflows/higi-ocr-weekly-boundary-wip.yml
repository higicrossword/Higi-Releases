name: Higi OCR weekly boundary diagnostics - WIP only, no APK release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/higi-ocr-weekly-boundary-wip.yml'
      - 'cloud-tests/ocr-weekly-boundary-wip/HigiCloudOcrRegressionTest.kt'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: higi-ocr-weekly-boundary-wip
  cancel-in-progress: true
jobs:
  android-ocr-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: higicrossword/Higi-Releases
      HIGI_ROOT: /tmp/higi-v209/HebrewCrosswordApp_v0.15.175
      QA_RESULTS: ${{ github.workspace }}/ocr-results-v209
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu runner already has Android SDK and cmdline-tools; avoid deprecated sdkmanager 'tools' package.
      - name: Preflight OCR runner syntax and 19-fixture execution
        shell: bash
        run: |
          set -euo pipefail
          bash -n cloud-tests/v209/emulator-ocr-run.sh
          bash cloud-tests/v209/test-emulator-ocr-runner.sh
      - name: Enable KVM acceleration for this ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::Host does not expose /dev/kvm; do not attempt 15-minute software emulation"
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # udev changes can be delayed; CI runner is disposable and access is local only.
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo chmod 0666 /dev/kvm
          fi
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm
          echo "::notice::KVM hardware acceleration is accessible"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify baseline source, reconstruct v208, and stage v209 offline test
        shell: bash
        run: |
          set -euo pipefail
          test -e cloud-releases/v0.15.209-DRY.json
          mkdir -p "/tmp/higi-v209" "$QA_RESULTS"
          curl --silent --show-error --fail --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "/tmp/higi-v209/base.zip" \
            "https://api.github.com/repos/$REPO/releases/assets/720424907"
          echo "ad14647edf7facd1d20309cfd2ae48cca779288ad06488c4d80b2404d8933dd7  /tmp/higi-v209/base.zip" | sha256sum -c -
          unzip -q "/tmp/higi-v209/base.zip" -d "/tmp/higi-v209"
          git -C "$HIGI_ROOT" init -q
          git -C "$HIGI_ROOT" add -A
          git -C "$HIGI_ROOT" -c user.name='Higi builder' -c user.email='higi-builder@users.noreply.github.com' commit -qm 'pinned v175'
          python3 - "$GITHUB_WORKSPACE" "/tmp/higi-v209" <<'PY'
          import base64,hashlib,json,lzma,pathlib,sys
          repo=pathlib.Path(sys.argv[1]);work=pathlib.Path(sys.argv[2])
          obj=json.loads((repo/'cloud-releases/v0.15.208-DRY.json').read_text())
          assert obj['version']=='0.15.208' and obj['versionCode']==358
          data=lzma.decompress(base64.b64decode((repo/obj['patchFile']).read_text().strip(),validate=True))
          assert hashlib.sha256(data).hexdigest()==obj['patchSha256']
          (work/'v208.patch').write_bytes(data)
          PY
          git -C "$HIGI_ROOT" apply --check "/tmp/higi-v209/v208.patch"
          git -C "$HIGI_ROOT" apply "/tmp/higi-v209/v208.patch"
          grep -q 'versionCode = 358' "$HIGI_ROOT/app/build.gradle.kts"
          # Record the exact v208 production Kotlin/Java source tree before adding the v209 test harness.
          python3 - "$HIGI_ROOT" "$QA_RESULTS" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]);out=pathlib.Path(sys.argv[2])
          src=root/'app/src/main/java'
          hashes={p.relative_to(src).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in src.rglob('*') if p.is_file()}
          assert len(hashes)>200, 'Missing reconstructed v208 application source'
          (out/'v208-production-source-sha256.json').write_text(json.dumps(hashes,indent=2)+'\n')
          print('SEALED_V208_PRODUCTION_SOURCE',len(hashes))
          PY
          mkdir -p "$HIGI_ROOT/app/src/androidTest/java/com/example/hebrewcrossword"
          cp "$GITHUB_WORKSPACE/cloud-tests/ocr-weekly-boundary-wip/HigiCloudOcrRegressionTest.kt" \
            "$HIGI_ROOT/app/src/androidTest/java/com/example/hebrewcrossword/"
          python3 - "$HIGI_ROOT/app/build.gradle.kts" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]);text=p.read_text()
          for a,b in [('versionCode = 358','versionCode = 359'),
                      ('versionName = "0.15.208"','versionName = "0.15.209"'),
                      ('        targetSdk = 35\n',
                       '        targetSdk = 35\n        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"\n'),
                      ('    testImplementation("junit:junit:4.13.2")',
                       '    testImplementation("junit:junit:4.13.2")\n    androidTestImplementation("androidx.test:runner:1.6.2")\n    androidTestImplementation("androidx.test.ext:junit:1.2.1")')]:
              assert text.count(a)==1, ('anchor mismatch',a)
              text=text.replace(a,b)
          p.write_text(text)
          PY
          python3 "$HIGI_ROOT/tools/sync-release-version.py" --write --root "$HIGI_ROOT"
          python3 "$HIGI_ROOT/tools/sync-release-version.py" --check --root "$HIGI_ROOT"
          git -C "$HIGI_ROOT" add -N -A
          git -C "$HIGI_ROOT" diff --check
          git -C "$HIGI_ROOT" diff --binary HEAD > "/tmp/higi-v209/v209.patch"
          test -s "/tmp/higi-v209/v209.patch"
          git -C "$HIGI_ROOT" reset --hard -q HEAD
          git -C "$HIGI_ROOT" clean -fdq
          git -C "$HIGI_ROOT" apply --check "/tmp/higi-v209/v209.patch"
          git -C "$HIGI_ROOT" apply "/tmp/higi-v209/v209.patch"
          python3 "$HIGI_ROOT/tools/sync-release-version.py" --check --root "$HIGI_ROOT"
          grep -q 'versionCode = 359' "$HIGI_ROOT/app/build.gradle.kts"
          # v209 adds test infrastructure only. This gate forbids accidental OCR/production changes.
          python3 - "$HIGI_ROOT" "$QA_RESULTS" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]);out=pathlib.Path(sys.argv[2]);src=root/'app/src/main/java'
          before=json.loads((out/'v208-production-source-sha256.json').read_text())
          after={p.relative_to(src).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in src.rglob('*') if p.is_file()}
          changed=sorted(k for k in set(before)|set(after) if before.get(k)!=after.get(k))
          assert not changed,'OCR/production source diverged from v208: '+', '.join(changed[:20])
          print('PASS_V209_PRODUCTION_OCR_IDENTICAL_TO_V208_FILES',len(after))
          PY
          test -f "$HIGI_ROOT/app/src/androidTest/java/com/example/hebrewcrossword/HigiCloudOcrRegressionTest.kt"
      - name: Apply bounded OCR word ownership fix ONLY in ephemeral emulator test source
        shell: bash
        run: |
          set -euo pipefail
          python3 cloud-tests/ocr-weekly-boundary-wip/apply_measured_grid_wip.py "$HIGI_ROOT"
          python3 - "$HIGI_ROOT" "$QA_RESULTS" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]);out=pathlib.Path(sys.argv[2])
          before=json.loads((out/'v208-production-source-sha256.json').read_text())
          src=root/'app/src/main/java'
          after={p.relative_to(src).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in src.rglob('*') if p.is_file()}
          changed=sorted(k for k in set(before)|set(after) if before.get(k)!=after.get(k))
          expected=['com/example/hebrewcrossword/HigiLocalOcrCropEngine.kt',
                    'com/example/hebrewcrossword/OcrWeeklySourceAnchorsV199.kt']
          assert changed==expected,('Unexpected WIP production changes',changed)
          print('WIP_ONLY_DIFF_VERIFIED',changed)
          PY
          git -C "$HIGI_ROOT" diff --check
      - name: Fetch and verify historical source fixture bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow numpy
          python3 cloud-tools/higi-20-yedioth-download-test.py > "$QA_RESULTS/fixture-download.log" 2>&1
          cat "$QA_RESULTS/fixture-download.log" | tail -25
          python3 - "$GITHUB_WORKSPACE" "$HIGI_ROOT" "$QA_RESULTS" <<'PY'
          import hashlib,json,pathlib,shutil,sys
          home=pathlib.Path(sys.argv[1]);root=pathlib.Path(sys.argv[2]);out=pathlib.Path(sys.argv[3])
          valid=json.loads((home/'cloud-tests/v209/dekel-source-sha256.json').read_text())
          assert len(valid)==20 and len({x['date'] for x in valid})==20
          entries=[]
          target=root/'app/src/androidTest/assets/higi-fixtures'
          target.mkdir(parents=True,exist_ok=True)
          for row in valid:
              src=home/'yedioth-20-fixtures'/f"{row['date']}.jpg"
              if not src.is_file():continue
              raw=src.read_bytes()
              actual=hashlib.sha256(raw).hexdigest()
              if actual!=row['sha256']:
                  print('SOURCE_HASH_MISMATCH',row['date'],actual)
                  continue
              name=row['date'].replace('-','')+'.jpg'
              (target/name).write_bytes(raw)
              entries.append((row['date'],name,actual))
              print('FIXTURE_OK',row['date'],len(raw))
          (target/'manifest.tsv').write_text(''.join('\t'.join(x)+'\n' for x in entries))
          (out/'fixture-coverage.json').write_text(json.dumps({
              'expected':20,'verified':len(entries),
              'present':[x[0] for x in entries],
              'missing':[x['date'] for x in valid if x['date'] not in {e[0] for e in entries}],
              'unverified_fixtures_used':0
          },indent=2)+'\n')
          assert len(entries)>=13, 'At least 13 SHA-verified historic JPEG sources required'
          PY
      - name: Compile Android tests and run existing JVM regressions
        shell: bash
        run: |
          set -euo pipefail
          cd "$HIGI_ROOT"
          gradle --no-daemon --stacktrace -PhigiDryBuild=true :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest \
            > "$QA_RESULTS/gradle.log" 2>&1 || { tail -130 "$QA_RESULTS/gradle.log"; exit 1; }
          tail -24 "$QA_RESULTS/gradle.log"
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Execute real local OCR and crop geometry on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          disable-linux-hw-accel: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 420
          script: bash "$GITHUB_WORKSPACE/cloud-tests/v209/emulator-ocr-run.sh"
      - name: Verify every OCR artifact and report cross-environment differences
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$QA_RESULTS" "$GITHUB_WORKSPACE" <<'PY'
          import csv,json,pathlib,sys,zipfile,io,struct
          out=pathlib.Path(sys.argv[1]);repo=pathlib.Path(sys.argv[2])
          rows=list(csv.DictReader((out/'ocr-cloud-v209/manifest.csv').open(newline='')))
          coverage=json.loads((out/'fixture-coverage.json').read_text())
          pinned={r['date']:r['sha256'] for r in json.loads(
              (repo/'cloud-tests/v209/dekel-source-sha256.json').read_text())}
          assert coverage['verified']>=19 and coverage['unverified_fixtures_used']==0
          assert len(rows)==coverage['verified']
          assert len({r['date'] for r in rows})==len(rows)
          assert set(r['date'] for r in rows)==set(coverage['present'])
          baseline={'11-11-26':16,'09-11-26':16,'04-11-26':16,'02-11-26':15,
              '28-10-26':16,'26-10-26':16,'14-10-26':13,'12-10-26':15,
              '07-10-26':15,'05-10-26':16,'14-09-26':15,'09-09-26':12,'07-09-26':16}
          compared=[];discrepancies=[]
          for row in rows:
              date=row['date'];n=int(row['proposed'])
              assert row['source_sha256']==pinned[date],('source hash mismatch',date)
              assert row['grid']=='9x9' and int(row['expected'])==16,(date,'bad grid')
              assert int(row['ocr_lines'])>0,(date,'OCR did not run')
              assert row['status'] in ('PROPOSED_16_REVIEW_ONLY','PARTIAL_REVIEW_ONLY'),(date,'bad status')
              assert not row['reason'],(date,row['reason'])
              archive=out/'ocr-cloud-v209'/row['zip']
              assert archive.is_file() and zipfile.is_zipfile(archive),(date,'missing zip')
              with zipfile.ZipFile(archive) as z:
                  assert z.testzip() is None,(date,'bad zip member')
                  names=set(z.namelist())
                  assert {'source.png','grid_candidates.json','crop_coordinates.csv',
                      'grid_repair_diagnostics.txt'}.issubset(names),(date,'missing diagnostics')
                  src=z.read('source.png')
                  assert src.startswith(b'\x89PNG\r\n\x1a\n'),(date,'not PNG')
                  w,h=struct.unpack('>II',src[16:24])
                  grids=json.loads(z.read('grid_candidates.json'))
                  assert grids.get('candidates'),(date,'no grids')
                  boxes=list(csv.DictReader(io.StringIO(z.read('crop_coordinates.csv').decode('utf8'))))
                  keys=set()
                  for box in boxes:
                      keys.add(box['key'])
                      assert box['status']=='REVIEW_ONLY',(date,'not DRY review-only')
                      assert box['file'] in names,(date,'missing image crop')
                      a,b,c,d=(float(box[x]) for x in ('left','top','right','bottom'))
                      assert 0<=a<c<=1 and 0<=b<d<=1,(date,'bad geometry')
                  assert len(keys)==n,(date,'reported count does not match crop keys',n,len(keys))
              old=baseline.get(date)
              record={'date':date,'proposed':n,'phone_v208_proposed':old,
                      'phone_delta':None if old is None else n-old,
                      'ocr_lines':int(row['ocr_lines']),'source_sha256':row['source_sha256']}
              compared.append(record)
              if old is not None and old!=n:
                  discrepancies.append(record)
                  print('::warning::CROSS-ENVIRONMENT difference (not a proven code regression): '
                      +date+' phone_v208='+str(old)+' emulator_v209='+str(n))
          summary={'version':'0.15.209','source_verified':coverage['verified'],
              'actual_ocr_runs':len(rows),'proposed_total':sum(x['proposed'] for x in compared),
              'compared_to_v208_phone':sum(x['phone_v208_proposed'] is not None for x in compared),
              'cross_environment_differences_not_code_regressions':discrepancies,
              'production_source':'SHA256_VERIFIED_IDENTICAL_TO_V208',
              'visual_crop_accuracy':'not_measured','fixture_details':compared,
              'firebase_writes':0,'canonical_writes':0}
          (out/'ocr-summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({k:v for k,v in summary.items() if k!='fixture_details'},indent=2))
          assert len(rows)>=19 and summary['proposed_total']>0
          PY
      - name: Upload reproducible OCR outputs and execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: higi-ocr-weekly-boundary-wip-results
          path: ocr-results-v209/
          retention-days: 7
          if-no-files-found: warn
