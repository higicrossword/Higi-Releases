name: Higi WIP - verify weekly OCR and swipe against pinned v197
on:
  push:
    branches: ['higi/yedioth-weekly-ocr-work']
    paths: ['.github/workflows/higi-weekly-swipe-wip-verify.yml']
  workflow_dispatch:
permissions:
  contents: write # Asset access to the pinned private baseline; workflow performs no writes
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: higicrossword/Higi-Releases
      BASE_SHA: ad14647edf7facd1d20309cfd2ae48cca779288ad06488c4d80b2404d8933dd7
      PATCH_SHA: bd973b2aa48e6e49256d1a1791200ca6b6c2fa5b092d1375d577c02bdc87fdb2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Reconstruct exact v197 and apply WIP fixes; no version increment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/higi-wip"
          curl -fsSL --retry 3 --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/octet-stream' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPO/releases/assets/720424907" \
            -o "$RUNNER_TEMP/higi-wip/baseline.zip"
          echo "$BASE_SHA  $RUNNER_TEMP/higi-wip/baseline.zip" | sha256sum -c
          unzip -q "$RUNNER_TEMP/higi-wip/baseline.zip" -d "$RUNNER_TEMP/higi-wip"
          ROOT="$RUNNER_TEMP/higi-wip/HebrewCrosswordApp_v0.15.175"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          git -C "$ROOT" init -q
          git -C "$ROOT" add -A
          git -C "$ROOT" -c user.name=CI -c user.email=ci@example.invalid commit -qm baseline
          python3 - "$GITHUB_WORKSPACE/cloud-patches/v0.15.197-from-v0.15.175.patch.xz.b64" "$RUNNER_TEMP/higi-wip/v197.patch" "$PATCH_SHA" <<'PY'
          import base64,hashlib,lzma,pathlib,sys
          raw=lzma.decompress(base64.b64decode(pathlib.Path(sys.argv[1]).read_text().strip(),validate=True))
          assert hashlib.sha256(raw).hexdigest()==sys.argv[3], 'v197 patch SHA mismatch'
          pathlib.Path(sys.argv[2]).write_bytes(raw)
          PY
          git -C "$ROOT" apply --check "$RUNNER_TEMP/higi-wip/v197.patch"
          git -C "$ROOT" apply "$RUNNER_TEMP/higi-wip/v197.patch"
          python3 "$GITHUB_WORKSPACE/cloud-tools/higi-weekly-swipe-wip-apply.py" \
            "$ROOT" "$GITHUB_WORKSPACE/cloud-tools"
          test "$(grep -Ec 'versionCode = 347' "$ROOT/app/build.gradle.kts")" = 1
          git -C "$ROOT" diff --stat HEAD
          echo "WIP_INTEGRATION_OK"
      - name: Compile and execute Android unit tests without APK or release
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          gradle --no-daemon :app:testDebugUnitTest --console plain
          echo 'WIP_ANDROID_TESTS_OK'
