name: Higi v0.15.200 - non-destructive overlap review DRY

on:
  push:
    branches: ['higi/v200-overlap-review-preservation']
    paths: ['.github/workflows/higi-generate-v200.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: higi-v200-source-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: higicrossword/Higi-Releases
      BASE_SHA: ad14647edf7facd1d20309cfd2ae48cca779288ad06488c4d80b2404d8933dd7
      V199_PATCH_SHA: c60c518a9d9685dad9c981f6fd1a37c127b0f6cfcdd6e36735d4e7db2b0973aa
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore pinned 0.15.199 and integrate V200 guarded DRY modifications
        shell: bash
        run: |
          set -euo pipefail
          ! gh release view v0.15.200-DRY --repo "$REPO" --json tagName >/dev/null 2>&1 || { echo 'V200 release already exists'; exit 1; }
          ! gh api "repos/$REPO/contents/cloud-releases/v0.15.200-DRY.json" >/dev/null 2>&1 || { echo 'V200 manifest already exists'; exit 1; }
          mkdir -p "$RUNNER_TEMP/higi200"
          curl --silent --show-error --fail --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/octet-stream' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$RUNNER_TEMP/higi200/base.zip" \
            "https://api.github.com/repos/$REPO/releases/assets/720424907"
          echo "$BASE_SHA  $RUNNER_TEMP/higi200/base.zip" | sha256sum --check --status
          unzip -q "$RUNNER_TEMP/higi200/base.zip" -d "$RUNNER_TEMP/higi200"
          ROOT="$RUNNER_TEMP/higi200/HebrewCrosswordApp_v0.15.175"
          test -f "$ROOT/app/build.gradle.kts"
          echo "HIGI200_ROOT=$ROOT" >> "$GITHUB_ENV"
          git -C "$ROOT" init -q
          git -C "$ROOT" add -A
          git -C "$ROOT" -c user.name='Higi-CI' -c user.email='ci@users.noreply.github.com' commit -qm pinned-v175
          python3 - "$GITHUB_WORKSPACE/cloud-patches/v0.15.199-from-v0.15.175.patch.xz.b64" "$RUNNER_TEMP/higi200/v199.patch" "$V199_PATCH_SHA" <<'PY'
          import base64,hashlib,lzma,pathlib,sys
          raw=lzma.decompress(base64.b64decode(pathlib.Path(sys.argv[1]).read_text().strip(),validate=True))
          assert hashlib.sha256(raw).hexdigest()==sys.argv[3], 'V199 patch sha mismatch'
          pathlib.Path(sys.argv[2]).write_bytes(raw)
          PY
          git -C "$ROOT" apply --check "$RUNNER_TEMP/higi200/v199.patch"
          git -C "$ROOT" apply "$RUNNER_TEMP/higi200/v199.patch"
          grep -q 'versionCode = 349' "$ROOT/app/build.gradle.kts"
          grep -q 'versionName = "0.15.199"' "$ROOT/app/build.gradle.kts"
          git -C "$ROOT" add -A
          git -C "$ROOT" -c user.name='Higi-CI' -c user.email='ci@users.noreply.github.com' commit -qm pinned-v199
          python3 "$GITHUB_WORKSPACE/cloud-tools/higi-v200-apply.py" "$ROOT"
          python3 "$ROOT/tools/sync-release-version.py" --write --root "$ROOT"
          python3 "$ROOT/tools/sync-release-version.py" --check --root "$ROOT"
          grep -q 'versionCode = 350' "$ROOT/app/build.gradle.kts"
          grep -q 'versionName = "0.15.200"' "$ROOT/app/build.gradle.kts"
          grep -q 'OcrWeeklyOverlapReviewV200.assess' "$ROOT/app/src/main/java/com/example/hebrewcrossword/HigiLocalOcrCropEngine.kt"
          grep -q 'V200_NARROW_PRINTED_NUMBER_REVIEW_ONLY' "$ROOT/app/src/main/java/com/example/hebrewcrossword/LocalOcrCropPass.kt"
          grep -q 'hasV200WeeklyOverlapWarning' "$ROOT/app/src/main/java/com/example/hebrewcrossword/AdminOcrRecropActivity.kt"
          grep -q 'YEDIOTH_DEKEL_WEEKLY' "$ROOT/app/src/main/java/com/example/hebrewcrossword/OcrSeriesProfilesV197.kt"
          test -f "$ROOT/app/src/test/java/com/example/hebrewcrossword/OcrWeeklyOverlapReviewV200Test.kt"
          grep -q 'BuildConfig.HIGI_DRY_BUILD && refineSharedRows' "$ROOT/app/src/main/java/com/example/hebrewcrossword/HigiLocalOcrCropEngine.kt"
          git -C "$ROOT" add -N -A
          git -C "$ROOT" diff --name-only HEAD > "$RUNNER_TEMP/higi200/changed.txt"
          python3 - "$RUNNER_TEMP/higi200/changed.txt" <<'PY'
          from pathlib import Path
          import sys
          paths=Path(sys.argv[1]).read_text().splitlines()
          allowed={'firebase/public/app-version.json','firebase/public/update/index.html'}
          bad=[p for p in paths if (p.startswith('firebase/') or p.startswith('cloudflare/') or p=='app/google-services.json') and p not in allowed]
          assert not bad,'Backend or Firebase mutation blocked: '+repr(bad)
          print('V200_BACKEND_IMMUTABILITY_OK')
          PY
          git -C "$ROOT" diff HEAD~1 --binary > "$RUNNER_TEMP/higi200/v200.patch"
          test -s "$RUNNER_TEMP/higi200/v200.patch"
          git -C "$ROOT" reset --hard -q HEAD~1
          git -C "$ROOT" clean -fdq
          git -C "$ROOT" apply --check "$RUNNER_TEMP/higi200/v200.patch"
          git -C "$ROOT" apply "$RUNNER_TEMP/higi200/v200.patch"
          python3 "$ROOT/tools/sync-release-version.py" --check --root "$ROOT"
          echo 'V200_SOURCE_RECONSTRUCTION_OK'
      - name: Full Android unit tests including overlap review + Tartey routing
        shell: bash
        run: |
          set -euo pipefail
          cd "$HIGI200_ROOT"
          gradle --no-daemon -PhigiDryBuild=true :app:testDebugUnitTest --console plain
          echo 'V200_ANDROID_REGRESSIONS_OK'
      - uses: actions/download-artifact@v4
        with:
          name: Yedioth-Dekel-20-originals-and-layout-audit
          run-id: 43105690198
          github-token: ${{ github.token }}
          path: "$RUNNER_TEMP/higi200/fixtures"
      - name: Verify all 20 historical source fixtures, SHA256 and unchanged family layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/higi200/fixtures" <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          target=Path(sys.argv[1])
          manifests=list(target.rglob('manifest.json'))
          assert len(manifests)==1,f'expected one manifest, got {len(manifests)}'
          base=manifests[0].parent
          items=json.loads(manifests[0].read_text())
          records=[r for r in items if r.get('status')=='downloaded']
          assert len(records)==20
          days=[r.get('weekday') for r in records]
          assert days.count('Monday')==9 and days.count('Wednesday')==11, days
          for row in records:
            file=base/row['file']
            assert file.exists() and file.stat().st_size==row['bytes'],row['file']
            assert hashlib.sha256(file.read_bytes()).hexdigest()==row['sha256'],row['file']
            assert row['same_layout_geometry'] and row['right_grid_detected'],row['file']
          print('V200_WEEKLY_CORPUS_SHA_20_OF_20_OK (source/layout only; not Android crop accuracy)')
          PY
      - name: Generate verified baseline source patch and manifest after tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/higi200/v200.patch" "$RUNNER_TEMP/higi200" <<'PY'
          import base64,hashlib,json,lzma,pathlib,sys
          raw=pathlib.Path(sys.argv[1]).read_bytes()
          dest=pathlib.Path(sys.argv[2])
          patch='v0.15.200-from-v0.15.175.patch.xz.b64'
          (dest/patch).write_text(base64.b64encode(lzma.compress(raw,preset=9)).decode()+'\n')
          cfg={'channel':'dry','version':'0.15.200','versionCode':350,
               'patchFile':'cloud-patches/'+patch,'patchSha256':hashlib.sha256(raw).hexdigest(),
               'notes':'Higi 0.15.200 DRY: show rather than hide overlapping weekly Yedioth OCR proposals, distinguish legacy/source-anchored evidence, provide cross-clue warning and block approval, permit independently anchored narrow number-only crop preview without changing geometry publication rules. Tartey/Hafuch unchanged. Canonical and Firebase untouched. Android unit regressions and 20-source fixture SHA checks passed; crop accuracy requires phone review.'}
          (dest/'v0.15.200-DRY.json').write_text(json.dumps(cfg,ensure_ascii=False,indent=2)+'\n')
          print('V200_PATCH_SHA256',cfg['patchSha256'])
          PY
      - name: Stage verified source patch on main for existing signed DRY APK builder
        shell: bash
        run: |
          set -euo pipefail
          git config user.name higicrossword
          git config user.email higicrossword@users.noreply.github.com
          git fetch origin main
          git checkout -B v200-stage origin/main
          test ! -e cloud-patches/v0.15.200-from-v0.15.175.patch.xz.b64
          test ! -e cloud-releases/v0.15.200-DRY.json
          cp "$RUNNER_TEMP/higi200/v0.15.200-from-v0.15.175.patch.xz.b64" cloud-patches/
          cp "$RUNNER_TEMP/higi200/v0.15.200-DRY.json" cloud-releases/
          git add cloud-patches/v0.15.200-from-v0.15.175.patch.xz.b64 cloud-releases/v0.15.200-DRY.json
          git commit -m 'Stage Higi 0.15.200 DRY passive overlap review after Android regression tests'
          git push origin HEAD:main
