name: Higi Hafuch six approved crop pixel fixtures (DRY)
on:
  push:
    branches: [higi/hafuch-number-boundary-guards-wip]
    paths:
      - '.github/workflows/higi-hafuch-six-approved-crops.yml'
      - 'cloud-tests/hafuch-ocr-crops-wip/hafuch-six-admin-confirmed-crops-2026-11-19.json'
      - 'cloud-tests/hafuch-ocr-crops-wip/verify_six_admin_confirmed_crops.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: higicrossword/Higi-Releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image decoder
        run: python -m pip install --quiet Pillow
      - name: Fetch pinned originals only
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pinned"
          gh run download 43939011519 --repo "$REPO" --name higi-hafuch-20-original-images-grid-audit --dir "$RUNNER_TEMP/pinned"
          (cd "$RUNNER_TEMP/pinned" && zip -qr "$RUNNER_TEMP/pinned-original.zip" hafuch-20-source-results)
      - name: Check six exact visually approved crop geometries
        run: |
          set -euo pipefail
          python -m py_compile cloud-tests/hafuch-ocr-crops-wip/verify_six_admin_confirmed_crops.py
          python cloud-tests/hafuch-ocr-crops-wip/verify_six_admin_confirmed_crops.py "$RUNNER_TEMP/pinned-original.zip" cloud-tests/hafuch-ocr-crops-wip/hafuch-six-admin-confirmed-crops-2026-11-19.json
