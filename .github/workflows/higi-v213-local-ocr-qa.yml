name: Higi v213 isolated local OCR QA (no APK, no publish)
on:
  push:
    branches: ['release/v0.15.213-oded-length-export']
    paths:
      - 'qa/v0.15.213/**'
      - '.github/workflows/higi-v213-local-ocr-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile and test isolated parser only
        shell: bash
        run: gradle -p qa/v0.15.213 qaCheck --no-daemon --stacktrace
